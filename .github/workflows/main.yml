name: Build UNIVERSAL-TRADING-BOT-A227C

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Validate A227C and Build Android APKs
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        shell: bash
        run: |
          set -euo pipefail
          echo "A227C repository contents:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 8 \
            -type f \
            -not -path '*/.git/*' \
            -print | sort

      - name: Locate A227C source archive
        id: locate_source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r candidate; do
            echo "Checking ZIP: $candidate"

            if ! unzip -t "$candidate" >/dev/null 2>&1; then
              echo "Invalid ZIP."
              continue
            fi

            if unzip -l "$candidate" 2>/dev/null | \
              grep -qE '(^|/)(backend/a227c/|a227c/research/|a227c_r[0-9]+/backend/a227c/)'; then
              ZIP_FILE="$candidate"
              echo "A227C archive found: $candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              ! -name 'gradle-*.zip' \
              ! -path '*/.git/*' \
              -print | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No A227C source ZIP found."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract A227C source
        shell: bash
        env:
          ZIP_FILE: ${{ steps.locate_source.outputs.zip_file }}
        run: |
          set -euo pipefail

          SOURCE_ROOT="$GITHUB_WORKSPACE/a227c-source"

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          unzip -q -o "$ZIP_FILE" -d "$SOURCE_ROOT"

          echo "A227C source extracted."

      - name: Locate A227C project root
        id: project_root
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="$GITHUB_WORKSPACE/a227c-source"
          PROJECT_DIR=""

          while IFS= read -r a227c_dir; do

            BACKEND_DIR="$(dirname "$a227c_dir")"

            if [ "$(basename "$BACKEND_DIR")" != "backend" ]; then
              continue
            fi

            CANDIDATE_ROOT="$(dirname "$BACKEND_DIR")"

            if [ -d "$CANDIDATE_ROOT/backend/a227c" ]; then
              PROJECT_DIR="$CANDIDATE_ROOT"
              break
            fi

          done < <(
            find "$SOURCE_ROOT" \
              -type d \
              -name "a227c" \
              -print | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate A227C project root."
            find "$SOURCE_ROOT" -maxdepth 6 -type d -print | sort
            exit 1
          fi

          echo "A227C project root:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate A227C backend
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -d backend
          test -d backend/a227c

          echo "Backend directory: OK"
          echo "A227C package: OK"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            pytest \
            pytest-asyncio \
            httpx

          python -m pytest --version

      - name: Install A227C backend dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt

          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt

          elif [ -f backend/pyproject.toml ]; then
            python -m pip install -e backend

          elif [ -f pyproject.toml ]; then
            python -m pip install -e .

          else
            echo "No dependency manifest found."
          fi

      - name: Configure Python import path
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          BACKEND_DIR="$PROJECT_DIR/backend"

          test -d "$BACKEND_DIR"
          test -d "$BACKEND_DIR/a227c"

          echo "PYTHONPATH=$BACKEND_DIR" >> "$GITHUB_ENV"

          echo "PYTHONPATH configured."

      - name: Verify A227C import
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -c "import a227c; print('A227C import OK:', a227c.__file__)"

      - name: Run Python compile check
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m compileall -q backend

          echo "Python compilation PASSED."

      - name: Run A227C test suite
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -d backend/tests ]; then
            python -m pytest \
              -q \
              backend/tests \
              -o asyncio_default_fixture_loop_scope=function

          elif [ -d tests ]; then
            python -m pytest \
              -q \
              tests \
              -o asyncio_default_fixture_loop_scope=function

          else
            echo "No test directory found."
          fi

      - name: Locate Android application
        id: android_project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ANDROID_DIR=""

          while IFS= read -r app_gradle; do

            APP_DIR="$(dirname "$app_gradle")"
            CANDIDATE_ROOT="$(dirname "$APP_DIR")"

            if [ -f "$CANDIDATE_ROOT/settings.gradle" ]; then
              SETTINGS="$CANDIDATE_ROOT/settings.gradle"

            elif [ -f "$CANDIDATE_ROOT/settings.gradle.kts" ]; then
              SETTINGS="$CANDIDATE_ROOT/settings.gradle.kts"

            else
              continue
            fi

            if grep -Eq \
              'com\.android\.application|com\.android\.library' \
              "$APP_DIR"/* \
              2>/dev/null; then

              ANDROID_DIR="$CANDIDATE_ROOT"
              break

            fi

          done < <(
            find . \
              -type f \
              \( \
                -path '*/app/build.gradle' \
                -o \
                -path '*/app/build.gradle.kts' \
              \) \
              ! -path './.git/*' \
              -print | sort
          )

          if [ -z "$ANDROID_DIR" ]; then
            echo "No verified Android application found."
            echo "android_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "android_available=true" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.android_project.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        if: steps.android_project.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android Debug APK
        if: steps.android_project.outputs.android_available == 'true'
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.android_project.outputs.android_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/$ANDROID_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Android Release APK
        if: steps.android_project.outputs.android_available == 'true'
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.android_project.outputs.android_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/$ANDROID_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload Android APKs
        if: steps.android_project.outputs.android_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Android-APKs
          if-no-files-found: error
          path: |
            ${{ steps.project_root.outputs.project_dir }}/${{ steps.android_project.outputs.android_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project_root.outputs.project_dir }}/${{ steps.android_project.outputs.android_dir }}/app/build/outputs/apk/release/*.apk

      - name: Final A227C status
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "A227C CI VALIDATION COMPLETED"
          echo "Project: $PROJECT_DIR"
          echo "Backend: VALIDATED"
          echo "Python: VALIDATED"
          echo "Tests: COMPLETED"

          if [ "${{ steps.android_project.outputs.android_available }}" = "true" ]; then
            echo "Android: BUILT"
          else
            echo "Android: NOT PRESENT IN SOURCE ARCHIVE"
          fi
