
name: A227C Complete Build and Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: a227c-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: A227C Source, Validation and Android Build
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ARTIFACT_DIR: ${{ github.workspace }}/a227c-artifacts
      SOURCE_DIR: ${{ github.workspace }}/a227c-source

    steps:

      # ================================================
      # 1. CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ================================================
      # 2. INITIALIZE DIRECTORIES
      # ================================================

      - name: Initialize build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR/source"
          mkdir -p "$ARTIFACT_DIR/reports"
          mkdir -p "$ARTIFACT_DIR/android"
          mkdir -p "$SOURCE_DIR"

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Artifacts: $ARTIFACT_DIR"
          echo "Source extraction: $SOURCE_DIR"

      # ================================================
      # 3. LOCATE AND EXTRACT A227C SOURCE
      # ================================================

      - name: Locate and extract A227C source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SOURCE_DIR="$GITHUB_WORKSPACE/a227c-source"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/a227c-artifacts"

          echo "Searching for A227C source..."

          PROJECT_DIR=""

          # Check for an already-extracted project.
          while IFS= read -r -d '' file; do
            PROJECT_DIR="${file%/backend/a227c/core/indicators.py}"
            break
          done < <(
            find "$ROOT" \
              -path "$ROOT/.git" -prune -o \
              -path "$SOURCE_DIR" -prune -o \
              -path "$ARTIFACT_DIR" -prune -o \
              -type f \
              -path '*/backend/a227c/core/indicators.py' \
              -print0
          )

          # If not extracted, inspect ZIP archives.
          if [ -z "$PROJECT_DIR" ]; then

            MATCHES=()

            while IFS= read -r -d '' archive; do

              if ! unzip -tq "$archive" >/dev/null 2>&1; then
                continue
              fi

              ENTRIES="$(unzip -Z1 "$archive" 2>/dev/null || true)"

              if printf '%s\n' "$ENTRIES" |
                grep -Eq '(^|/)backend/a227c/core/indicators\.py$'; then
                MATCHES+=("$archive")
              fi

            done < <(
              find "$ROOT" \
                -path "$ROOT/.git" -prune -o \
                -path "$SOURCE_DIR" -prune -o \
                -path "$ARTIFACT_DIR" -prune -o \
                -type f -iname '*.zip' -print0
            )

            if [ "${#MATCHES[@]}" -eq 0 ]; then
              echo "ERROR: No valid A227C source ZIP was found."
              echo "Required file:"
              echo "backend/a227c/core/indicators.py"
              exit 1
            fi

            if [ "${#MATCHES[@]}" -gt 1 ]; then
              echo "ERROR: Multiple A227C source ZIPs were found."
              printf '%s\n' "${MATCHES[@]}"
              echo "Keep only the intended source archive."
              exit 1
            fi

            ARCHIVE="${MATCHES[0]}"

            echo "Recognized source archive:"
            echo "$ARCHIVE"

            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"

            unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

            echo "Source archive extracted."

            # Derive project root from the actual file path.
            while IFS= read -r -d '' file; do
              PROJECT_DIR="${file%/backend/a227c/core/indicators.py}"
              break
            done < <(
              find "$SOURCE_DIR" \
                -type f \
                -path '*/backend/a227c/core/indicators.py' \
                -print0
            )
          fi

          # Validate project root.
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: A227C project root could not be located."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/backend/a227c/core/indicators.py" ]; then
            echo "ERROR: A227C indicators module is missing."
            echo "Detected path: $PROJECT_DIR"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/backend/a227c" ]; then
            echo "ERROR: A227C package directory is missing."
            exit 1
          fi

          echo "========================================"
          echo "A227C PROJECT ROOT VERIFIED"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PYTHONPATH=$PROJECT_DIR/backend"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PROJECT_DIR/backend" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ================================================
      # 4. PACKAGE SOURCE
      # ================================================

      - name: Package A227C source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          OUTPUT="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          mkdir -p "$(dirname "$OUTPUT")"
          rm -f "$OUTPUT"

          echo "Packaging project:"
          echo "$PROJECT_DIR"

          zip -qr "$OUTPUT" . \
            -x "./.git/*" \
            -x "./.venv/*" \
            -x "./venv/*" \
            -x "./__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "./.pytest_cache/*" \
            -x "./a227c-artifacts/*" \
            -x "./a227c-source/*"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Source ZIP was not created."
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -tq "$OUTPUT"

          echo "Source ZIP created:"
          ls -lh "$OUTPUT"

          echo "package_ready=true" >> "$GITHUB_OUTPUT"

      # ================================================
      # 5. SET UP PYTHON
      # ================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================================
      # 6. INSTALL DEPENDENCIES
      # ================================================

      - name: Install A227C Python dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m pip install --upgrade pip setuptools wheel

          # NumPy must be installed before importing indicators.
          python -m pip install numpy

          REQUIREMENTS_FILES=(
            "$PROJECT_DIR/backend/requirements.txt"
            "$PROJECT_DIR/requirements.txt"
            "$PROJECT_DIR/backend/requirements-dev.txt"
            "$PROJECT_DIR/requirements-dev.txt"
          )

          for REQUIREMENTS in "${REQUIREMENTS_FILES[@]}"; do
            if [ -f "$REQUIREMENTS" ]; then
              echo "Installing $REQUIREMENTS"
              python -m pip install -r "$REQUIREMENTS"
            fi
          done

          if [ -f "$PROJECT_DIR/backend/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR/backend"

          elif [ -f "$PROJECT_DIR/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR"
          fi

          python -m pip install pytest pytest-asyncio httpx

          python -c "import numpy; print('NumPy:', numpy.__version__)"

          python -m pip check

          echo "Python dependencies installed."

      # ================================================
      # 7. VERIFY IMPORTS
      # ================================================

      - name: Verify A227C imports
        id: imports
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -c "import a227c"
          python -c "import a227c.core.indicators"

          python -c "import numpy as np; print(np.array([1, 2, 3]))"

          echo "A227C imports verified successfully."

      # ================================================
      # 8. COMPILE PYTHON
      # ================================================

      - name: Compile A227C Python source
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m compileall -q backend/a227c

          echo "Python compilation successful."

      # ================================================
      # 9. RUN TESTS
      # ================================================

      - name: Run A227C automated tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mapfile -t TEST_FILES < <(
            find . \
              -path './.git' -prune -o \
              -path './.venv' -prune -o \
              -path './venv' -prune -o \
              -path '*/__pycache__' -prune -o \
              -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -print
          )

          if [ "${#TEST_FILES[@]}" -gt 0 ]; then
            echo "Found ${#TEST_FILES[@]} test files."
            python -m pytest -v "${TEST_FILES[@]}"
          else
            echo "WARNING: No automated Python test files found."
            echo "No test suite was executed."
          fi

      # ================================================
      # 10. DETECT A COMPLETE ANDROID PROJECT
      # ================================================

      - name: Detect Android application
        id: android
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for a complete Android Gradle project..."

          APP_GRADLE=""
          ANDROID_ROOT=""

          # Search app Gradle files.
          while IFS= read -r -d '' candidate; do

            if ! grep -Eq \
              'com\.android\.application|libs\.plugins\.android\.application|alias[[:space:]]*\([[:space:]]*libs\.plugins\.android\.application' \
              "$candidate"; then
              continue
            fi

            echo "Android application candidate:"
            echo "$candidate"

            # Walk upwards, including PROJECT_DIR itself.
            current="$(dirname "$candidate")"

            while :; do

              if [ -f "$current/settings.gradle" ] ||
                 [ -f "$current/settings.gradle.kts" ]; then

                APP_GRADLE="$candidate"
                ANDROID_ROOT="$current"
                break
              fi

              if [ "$current" = "$PROJECT_DIR" ] ||
                 [ "$current" = "/" ]; then
                break
              fi

              case "$current/" in
                "$PROJECT_DIR/"*)
                  current="$(dirname "$current")"
                  ;;
                *)
                  break
                  ;;
              esac

            done

            if [ -n "$ANDROID_ROOT" ]; then
              break
            fi

          done < <(
            find "$PROJECT_DIR" \
              -path '*/.gradle' -prune -o \
              -path '*/build' -prune -o \
              -type f \
              \( -path '*/app/build.gradle' -o \
                 -path '*/app/build.gradle.kts' \) \
              -print0
          )

          if [ -z "$APP_GRADLE" ] || [ -z "$ANDROID_ROOT" ]; then

            echo "No complete Android Gradle application was detected."
            echo "A Gradle module without a matching settings file"
            echo "cannot be treated as a buildable Android project."

            echo "android_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "========================================"
          echo "VALID ANDROID PROJECT DETECTED"
          echo "========================================"

          echo "Application module:"
          echo "$APP_GRADLE"

          echo "Android project root:"
          echo "$ANDROID_ROOT"

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "android_available=true" >> "$GITHUB_OUTPUT"

      # ================================================
      # 11. JAVA 17
      # ================================================

      - name: Set up Java 17
        if: steps.android.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ================================================
      # 12. ANDROID SDK
      # ================================================

      - name: Set up Android SDK
        if: steps.android.outputs.android_available == 'true'
        uses: android-actions/setup-android@v3

      # ================================================
      # 13. GRADLE 8.7
      # ================================================

      - name: Set up Gradle 8.7
        if: steps.android.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ================================================
      # 14. BUILD DEBUG AND RELEASE APK
      # ================================================

      - name: Build Android Debug and Release APK
        id: android_build
        if: steps.android.outputs.android_available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug \
            assembleRelease

          mapfile -t APK_FILES < <(
            find "$ANDROID_ROOT" \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          DEBUG_FOUND=false
          RELEASE_FOUND=false

          for APK in "${APK_FILES[@]}"; do

            echo "APK: $APK"

            case "$APK" in
              *debug*.apk)
                cp "$APK" "$ARTIFACT_DIR/android/A227C-debug.apk"
                DEBUG_FOUND=true
                ;;
              *release*.apk)
                cp "$APK" "$ARTIFACT_DIR/android/A227C-release.apk"
                RELEASE_FOUND=true
                ;;
            esac

          done

          if [ "$DEBUG_FOUND" != true ]; then
            echo "ERROR: Debug APK missing."
            exit 1
          fi

          if [ "$RELEASE_FOUND" != true ]; then
            echo "ERROR: Release APK missing."
            exit 1
          fi

          echo "Debug and Release APKs generated."

      # ================================================
      # 15. BUILD REPORT
      # ================================================

      - name: Generate A227C build report
        if: always()
        shell: bash
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          IMPORT_RESULT: ${{ steps.imports.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          ANDROID_RESULT: ${{ steps.android_build.outcome }}
          ANDROID_AVAILABLE: ${{ steps.android.outputs.android_available }}
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR/reports"

          REPORT="$ARTIFACT_DIR/reports/A227C-BUILD-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "BUILD AND VALIDATION REPORT"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Source discovery: ${SOURCE_RESULT:-not completed}"
            echo "Source packaging: ${PACKAGE_RESULT:-not completed}"
            echo "Dependencies: ${DEPENDENCY_RESULT:-not completed}"
            echo "Imports: ${IMPORT_RESULT:-not completed}"
            echo "Compilation: ${COMPILE_RESULT:-not completed}"
            echo "Tests: ${TEST_RESULT:-not completed}"
            echo "Android detected: ${ANDROID_AVAILABLE:-unknown}"
            echo "Android build: ${ANDROID_RESULT:-not executed}"
            echo
            echo "A successful source package is not proof of"
            echo "live market-data provider connectivity."
            echo "It does not establish deployment or device acceptance."
            echo
            echo "A227C is a signal-analysis application."
            echo "It does not execute broker trades."
          } > "$REPORT"

          cat "$REPORT"

      # ================================================
      # 16. VERIFY SOURCE ARTIFACT
      # ================================================

      - name: Verify generated source artifact
        if: always() && steps.package.outputs.package_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP is missing or empty."
            exit 1
          fi

          unzip -tq "$SOURCE_ZIP"

          echo "Source ZIP integrity verified."
          ls -lh "$SOURCE_ZIP"

      # ================================================
      # 17. UPLOAD ARTIFACTS
      # ================================================

      - name: Upload A227C build artifacts
        if: always() && steps.package.outputs.package_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-BUILD
          path: a227c-artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      # ================================================
      # 18. FINAL STATUS
      # ================================================

      - name: Final build status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "========================================"
          echo "UNIVERSAL-TRADING-BOT-A227C"
          echo "BUILD PROCESS FINISHED"
          echo "========================================"
          echo "Job status: $JOB_STATUS"
          echo "Artifact directory: $ARTIFACT_DIR"
          
