name: A227C Complete Build and Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: A227C Validation and Artifact Production
    runs-on: ubuntu-22.04

    env:
      ARTIFACT_DIR: ${{ github.workspace }}/a227c-artifacts
      SOURCE_DIR: ${{ github.workspace }}/a227c-source

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. INITIALIZE WORKSPACE
      # ==========================================================

      - name: Initialize build workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ARTIFACT_DIR"
          rm -rf "$SOURCE_DIR"

          mkdir -p "$ARTIFACT_DIR/source"
          mkdir -p "$ARTIFACT_DIR/reports"
          mkdir -p "$SOURCE_DIR"

          echo "Workspace initialized."

          echo "Repository:"
          pwd

          echo "Artifact directory:"
          ls -ld "$ARTIFACT_DIR"

      # ==========================================================
      # 3. INSPECT REPOSITORY
      # ==========================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "REPOSITORY CONTENTS"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            ! -path "*/.git/*" \
            ! -path "*/a227c-artifacts/*" \
            | sort \
            | head -500

          echo ""
          echo "SOURCE ARCHIVES"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "*/a227c-artifacts/*" \
            -print

      # ==========================================================
      # 4. DISCOVER SOURCE ARCHIVE
      # ==========================================================

      - name: Discover A227C source archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          MATCHES="$RUNNER_TEMP/a227c-archives.txt"
          : > "$MATCHES"

          echo "Inspecting ZIP archives..."

          while IFS= read -r archive; do

            if ! unzip -t "$archive" >/dev/null 2>&1; then
              echo "Ignoring invalid archive: $archive"
              continue
            fi

            if unzip -Z1 "$archive" 2>/dev/null |
              grep -Eiq '(^|/)backend/a227c/'; then

              echo "A227C source candidate:"
              echo "$archive"

              echo "$archive" >> "$MATCHES"

            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "*/a227c-artifacts/*" \
              ! -path "*/a227c-source/*" \
              | sort
          )

          COUNT="$(wc -l < "$MATCHES")"

          if [ "$COUNT" -eq 0 ]; then

            echo "No A227C source archive found."

            echo "Checking whether the repository itself contains the source."

            if [ -d "$GITHUB_WORKSPACE/backend/a227c" ]; then
              echo "source_mode=repository" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ERROR: No source archive containing backend/a227c was found."
            echo "The workflow will not invent or generate replacement source."
            exit 1

          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: Multiple A227C source archives were found."
            cat "$MATCHES"
            echo "Remove ambiguity by keeping one intended source archive."
            exit 1
          fi

          ARCHIVE="$(head -n 1 "$MATCHES")"

          echo "Selected source archive:"
          echo "$ARCHIVE"

          echo "source_mode=archive" >> "$GITHUB_OUTPUT"
          echo "source_archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 5. EXTRACT SOURCE ARCHIVE
      # ==========================================================

      - name: Extract A227C source
        id: extraction
        if: steps.archive.outputs.source_mode == 'archive'
        env:
          SOURCE_ARCHIVE: ${{ steps.archive.outputs.source_archive }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Extracting:"
          echo "$SOURCE_ARCHIVE"

          unzip -q "$SOURCE_ARCHIVE" -d "$SOURCE_DIR"

          echo ""
          echo "Extracted files:"
          find "$SOURCE_DIR" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500

          test -n "$(find "$SOURCE_DIR" -type f -print -quit)"

          echo "Extraction verified."

      # ==========================================================
      # 6. LOCATE PROJECT ROOT AFTER EXTRACTION
      # ==========================================================

      - name: Locate actual A227C project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.archive.outputs.source_mode }}" = "repository" ]; then
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          else
            SEARCH_ROOT="$SOURCE_DIR"
          fi

          PROJECT_DIR=""

          echo "Searching extracted source:"
          echo "$SEARCH_ROOT"

          while IFS= read -r backend_dir; do

            if [ -d "$backend_dir/a227c" ]; then
              PROJECT_DIR="$(dirname "$backend_dir")"
              break
            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type d \
              -name backend \
              ! -path "*/.git/*" \
              ! -path "*/a227c-artifacts/*" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Extracted source does not contain backend/a227c."

            echo ""
            echo "Extracted directory structure:"

            find "$SEARCH_ROOT" \
              -maxdepth 6 \
              -type d \
              | sort

            exit 1

          fi

          echo ""
          echo "A227C PROJECT ROOT:"
          echo "$PROJECT_DIR"

          echo ""
          echo "A227C BACKEND:"
          find "$PROJECT_DIR/backend/a227c" \
            -maxdepth 4 \
            -type f \
            | sort

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 7. VALIDATE SOURCE STRUCTURE
      # ==========================================================

      - name: Validate source structure
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -d "$PROJECT_DIR/backend"
          test -d "$PROJECT_DIR/backend/a227c"

          if [ ! -d "$PROJECT_DIR/backend/a227c/core" ]; then
            echo "ERROR: Expected A227C core package is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/backend/a227c/core/indicators.py" ]; then
            echo "ERROR: Expected indicators module is missing."
            exit 1
          fi

          echo "A227C source structure verified."

      # ==========================================================
      # 8. PYTHON 3.11
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 9. INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f "$PROJECT_DIR/requirements.txt" ]; then
            python -m pip install \
              -r "$PROJECT_DIR/requirements.txt"
          fi

          if [ -f "$PROJECT_DIR/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR"
          fi

          python -m pip install \
            pytest \
            pytest-asyncio \
            httpx

      # ==========================================================
      # 10. CONFIGURE PYTHON PATH
      # ==========================================================

      - name: Configure Python path
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "PYTHONPATH=$PROJECT_DIR/backend" >> "$GITHUB_ENV"

      # ==========================================================
      # 11. VERIFY IMPORTS
      # ==========================================================

      - name: Verify A227C imports
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -c "import a227c"
          python -c "import a227c.core.indicators"

          echo "A227C imports verified."

      # ==========================================================
      # 12. COMPILE
      # ==========================================================

      - name: Compile A227C Python modules
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall \
            -q "$PROJECT_DIR/backend"

          echo "Compilation successful."

      # ==========================================================
      # 13. RUN TESTS
      # ==========================================================

      - name: Run A227C tests
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -d "backend/tests" ]; then
            TEST_DIR="backend/tests"
          elif [ -d "tests" ]; then
            TEST_DIR="tests"
          else
            echo "ERROR: A227C test directory not found."
            exit 1
          fi

          python -m pytest \
            "$TEST_DIR" \
            -o asyncio_default_fixture_loop_scope=function \
            -ra

      # ==========================================================
      # 14. CREATE VALIDATION REPORT
      # ==========================================================

      - name: Create validation report
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$ARTIFACT_DIR/reports/A227C-VALIDATION-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "BUILD VALIDATION REPORT"
            echo "======================="
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Project:"
            echo "$PROJECT_DIR"
            echo ""
            echo "Python:"
            python --version
            echo ""
            echo "Backend:"
            echo "VALIDATED"
            echo ""
            echo "Compilation:"
            echo "PASSED"
            echo ""
            echo "Tests:"
            echo "PASSED"
          } > "$REPORT"

          test -s "$REPORT"

      # ==========================================================
      # 15. DETECT ANDROID PROJECT
      # ==========================================================

      - name: Detect Android application
        id: android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_ROOT=""

          while IFS= read -r app_dir; do

            parent="$(dirname "$app_dir")"

            if [ ! -f "$app_dir/build.gradle" ] &&
               [ ! -f "$app_dir/build.gradle.kts" ]; then
              continue
            fi

            if [ ! -f "$parent/settings.gradle" ] &&
               [ ! -f "$parent/settings.gradle.kts" ]; then
              continue
            fi

            if grep -Rqs \
              "com.android.application" \
              "$parent" \
              --include="*.gradle" \
              --include="*.gradle.kts"; then

              ANDROID_ROOT="$parent"
              break

            fi

          done < <(
            find "$PROJECT_DIR" \
              -type d \
              -name app \
              ! -path "*/.git/*" \
              | sort
          )

          if [ -n "$ANDROID_ROOT" ]; then

            echo "Android project found:"
            echo "$ANDROID_ROOT"

            echo "android_available=true" >> "$GITHUB_OUTPUT"
            echo "android_root=$ANDROID_ROOT" >> "$GITHUB_OUTPUT"

          else

            echo "No Android application module found in source."

            echo "android_available=false" >> "$GITHUB_OUTPUT"
            echo "android_root=" >> "$GITHUB_OUTPUT"

          fi

      # ==========================================================
      # 16. JAVA 17
      # ==========================================================

      - name: Set up Java 17
        if: steps.android.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 17. ANDROID SDK
      # ==========================================================

      - name: Set up Android SDK
        if: steps.android.outputs.android_available == 'true'
        uses: android-actions/setup-android@v3

      # ==========================================================
      # 18. GRADLE 8.7
      # ==========================================================

      - name: Set up Gradle 8.7
        if: steps.android.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ==========================================================
      # 19. BUILD DEBUG APK
      # ==========================================================

      - name: Build Debug APK
        if: steps.android.outputs.android_available == 'true'
        env:
          ANDROID_ROOT: ${{ steps.android.outputs.android_root }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

          DEBUG_APK="$(
            find "$ANDROID_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*debug*.apk" \
              | head -1
          )"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR/android"

          cp "$DEBUG_APK" \
            "$ARTIFACT_DIR/android/A227C-debug.apk"

          test -s "$ARTIFACT_DIR/android/A227C-debug.apk"

          echo "Debug APK verified."

      # ==========================================================
      # 20. BUILD RELEASE APK
      # ==========================================================

      - name: Build Release APK
        if: steps.android.outputs.android_available == 'true'
        env:
          ANDROID_ROOT: ${{ steps.android.outputs.android_root }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            gradle --no-daemon assembleRelease
          fi

          RELEASE_APK="$(
            find "$ANDROID_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*release*.apk" \
              | head -1
          )"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR/android"

          cp "$RELEASE_APK" \
            "$ARTIFACT_DIR/android/A227C-release.apk"

          test -s "$ARTIFACT_DIR/android/A227C-release.apk"

          echo "Release APK verified."

      # ==========================================================
      # 21. PACKAGE COMPLETE A227C SOURCE
      # ==========================================================

      - name: Package complete A227C source
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          cd "$PROJECT_DIR"

          zip -qr "$SOURCE_ZIP" . \
            -x ".git/*" \
            -x "*/.git/*" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x ".pytest_cache/*" \
            -x "*/.pytest_cache/*" \
            -x "a227c-artifacts/*" \
            -x "*/a227c-artifacts/*"

          test -s "$SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP"

          echo "Complete source ZIP created."

      # ==========================================================
      # 22. VERIFY ARTIFACTS
      # ==========================================================

      - name: Verify all artifacts
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"
          REPORT="$ARTIFACT_DIR/reports/A227C-VALIDATION-REPORT.txt"

          echo "=========================================="
          echo "A227C ARTIFACT VERIFICATION"
          echo "=========================================="

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP missing."
            exit 1
          fi

          if [ ! -s "$REPORT" ]; then
            echo "ERROR: Validation report missing."
            exit 1
          fi

          if [ "${{ steps.android.outputs.android_available }}" = "true" ]; then

            test -s "$ARTIFACT_DIR/android/A227C-debug.apk"
            test -s "$ARTIFACT_DIR/android/A227C-release.apk"

            echo "Debug APK: VERIFIED"
            echo "Release APK: VERIFIED"

          else

            echo "Android module: NOT FOUND"
            echo "APK production: NOT CLAIMED"

          fi

          echo ""
          echo "ACTUAL ARTIFACT FILES:"

          find "$ARTIFACT_DIR" \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo ""
          echo "SOURCE ZIP: VERIFIED"
          echo "REPORT: VERIFIED"

      # ==========================================================
      # 23. UPLOAD ARTIFACTS
      # ==========================================================

      - name: Upload A227C build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A227C-COMPLETE-BUILD-${{ github.run_number }}
          path: ${{ github.workspace }}/a227c-artifacts/
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 24. FINAL STATUS
      # ==========================================================

      - name: Final build status
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "A227C BUILD SUCCESS"
          echo "=========================================="

          echo "Backend validation: PASSED"
          echo 
