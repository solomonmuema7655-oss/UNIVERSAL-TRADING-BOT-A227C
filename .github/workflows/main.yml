name: Build UNIVERSAL-TRADING-BOT-A227C APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build A227C Android APKs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/platform-tools"
          echo "Android SDK verified: $SDK"

      - name: Locate and extract A227C ZIP
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_DIR="$WORKSPACE/a227c-extracted"
          PROJECT_DIR=""

          find_project() {
            local SEARCH_DIR="$1"

            while IFS= read -r SETTINGS; do
              local DIR
              DIR="$(dirname "$SETTINGS")"

              if [ -f "$DIR/android/app/build.gradle.kts" ] || \
                 [ -f "$DIR/android/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ]; then
                PROJECT_DIR="$DIR"
                return 0
              fi
            done < <(
              find "$SEARCH_DIR" \
                -type d \( -name .git -o -name .gradle -o -name build \) -prune \
                -o -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
            )

            return 1
          }

          if ! find_project "$WORKSPACE"; then

            ZIP_FILE="$(find "$WORKSPACE" \
              -type f \
              -name 'UNIVERSAL-TRADING-BOT-A227C-FINAL-BUILD.zip' \
              ! -path '*/.git/*' \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find "$WORKSPACE" \
                -type f \
                -iname '*A227C*.zip' \
                ! -iname 'gradle-*.zip' \
                ! -path '*/.git/*' \
                -print -quit || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: A227C ZIP not found."
              find "$WORKSPACE" -maxdepth 5 -type f -print
              exit 1
            fi

            echo "Selected ZIP: $ZIP_FILE"
            unzip -t "$ZIP_FILE"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            if ! find_project "$EXTRACT_DIR"; then
              echo "ERROR: Android Gradle project not found inside ZIP."
              find "$EXTRACT_DIR" -maxdepth 7 -type f -print
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "A227C project root: $PROJECT_DIR"

      - name: Verify Android project and logo
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          if [ -f android/app/build.gradle.kts ] || [ -f android/app/build.gradle ]; then
            MODULE="android/app"
          elif [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            MODULE="app"
          else
            echo "ERROR: Android module not found."
            exit 1
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -f "$MODULE/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: Android manifest missing."
            exit 1
          fi

          if ! find "$MODULE/src/main" -type f \( -name '*.kt' -o -name '*.java' \) -print -quit | grep -q .; then
            echo "ERROR: Android source files missing."
            exit 1
          fi

          if [ "$MODULE" = "android/app" ]; then
            LOGO="$MODULE/src/main/res/drawable-nodpi/a227c_logo.png"
          else
            LOGO="$MODULE/src/main/res/drawable-nodpi/a227c_logo.png"
          fi

          if [ ! -s "$LOGO" ]; then
            echo "ERROR: Official A227C logo missing: $LOGO"
            find "$MODULE/src/main/res" -type f -print
            exit 1
          fi

          echo "Android module verified: $MODULE"
          echo "Official A227C logo verified."
          echo "BUILD_MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Verify Gradle 8.7
        shell: bash
        run: gradle --version

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          gradle --no-daemon -p "$BUILD_MODULE" clean --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          gradle --no-daemon -p "$BUILD_MODULE" assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$BUILD_DIR/$BUILD_MODULE/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK missing."
            find "$BUILD_DIR/$BUILD_MODULE/build/outputs" -type f -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Debug-APK
          path: ${{ env.BUILD_DIR }}/${{ env.BUILD_MODULE }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          gradle --no-daemon -p "$BUILD_MODULE" assembleRelease --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$BUILD_DIR/$BUILD_MODULE/build/outputs/apk/release"
          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK missing."
            find "$BUILD_DIR/$BUILD_MODULE/build/outputs" -type f -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Release-APK
          path: ${{ env.BUILD_DIR }}/${{ env.BUILD_MODULE }}/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "UNIVERSAL-TRADING-BOT-A227C"
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "Debug APK: GENERATED"
          echo "Release APK: GENERATED"
          echo "=============================================="
