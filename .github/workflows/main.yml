name: Build UNIVERSAL-TRADING-BOT-A227C

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build A227C Android Application
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "BUILD_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          SETTINGS_FILE=$(find . -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "BUILD_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify A227C project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "A227C project structure verified."

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$BUILD_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK: $APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Debug-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$BUILD_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Release APK: $APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Release-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
