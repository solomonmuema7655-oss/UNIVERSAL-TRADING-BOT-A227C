name: A227C Hardened Build and Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: A227C Validation and Artifact Build
    runs-on: ubuntu-22.04

    env:
      ARTIFACT_DIR: ${{ github.workspace }}/a227c-artifacts

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout A227C
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. CREATE ARTIFACT DIRECTORY IMMEDIATELY
      # ============================================================
      - name: Initialize artifact workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/source"
          mkdir -p "$ARTIFACT_DIR/reports"

          echo "Workspace:"
          pwd

          echo ""
          echo "Artifact directory:"
          ls -la "$ARTIFACT_DIR"

      # ============================================================
      # 3. INSPECT ACTUAL CHECKED-OUT REPOSITORY
      # ============================================================
      - name: Inspect repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "A227C REPOSITORY STRUCTURE"
          echo "============================================================"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type f \
            ! -path "*/.git/*" \
            | sort \
            | head -500

      # ============================================================
      # 4. LOCATE ACTUAL A227C ROOT
      # ============================================================
      - name: Locate A227C project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          echo "Searching for backend/a227c..."

          while IFS= read -r candidate; do
            parent="$(dirname "$candidate")"

            if [ -d "$parent/a227c" ]; then
              PROJECT_DIR="$parent"
              break
            fi
          done < <(
            find "$ROOT" \
              -type d \
              -name "backend" \
              -not -path "*/.git/*" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "Searching directly for a227c directories..."

            while IFS= read -r candidate; do
              parent="$(dirname "$candidate")"

              if [ "$(basename "$parent")" = "backend" ]; then
                PROJECT_DIR="$(dirname "$parent")"
                break
              fi
            done < <(
              find "$ROOT" \
                -type d \
                -name "a227c" \
                -not -path "*/.git/*" \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: A227C project root could not be located."
            echo ""
            echo "Directories containing backend:"
            find "$ROOT" \
              -type d \
              -name "backend" \
              -not -path "*/.git/*" \
              | sort || true
            exit 1
          fi

          echo ""
          echo "A227C PROJECT ROOT:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. VALIDATE BACKEND
      # ============================================================
      - name: Validate A227C backend
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -d "$PROJECT_DIR/backend"
          test -d "$PROJECT_DIR/backend/a227c"

          echo "Backend directory verified."

          echo ""
          echo "A227C modules:"
          find "$PROJECT_DIR/backend/a227c" \
            -maxdepth 4 \
            -type f \
            | sort

      # ============================================================
      # 6. SET UP PYTHON
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 7. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f "$PROJECT_DIR/requirements.txt" ]; then
            python -m pip install -r "$PROJECT_DIR/requirements.txt"
          fi

          if [ -f "$PROJECT_DIR/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR"
          fi

          python -m pip install \
            pytest \
            pytest-asyncio \
            httpx

      # ============================================================
      # 8. CONFIGURE PYTHON PATH
      # ============================================================
      - name: Configure Python path
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "PYTHONPATH=$PROJECT_DIR/backend" >> "$GITHUB_ENV"

      # ============================================================
      # 9. VERIFY IMPORT
      # ============================================================
      - name: Verify A227C imports
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -c "import a227c"
          python -c "import a227c.core.indicators"

          echo "A227C imports: PASSED"

      # ============================================================
      # 10. COMPILE
      # ============================================================
      - name: Compile A227C Python
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q "$PROJECT_DIR/backend"

          echo "Python compilation: PASSED"

      # ============================================================
      # 11. RUN TESTS
      # ============================================================
      - name: Run A227C tests
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -d "backend/tests" ]; then
            TEST_DIR="backend/tests"
          elif [ -d "tests" ]; then
            TEST_DIR="tests"
          else
            echo "ERROR: No test directory found."
            exit 1
          fi

          echo "Running:"
          echo "$TEST_DIR"

          python -m pytest \
            "$TEST_DIR" \
            -o asyncio_default_fixture_loop_scope=function \
            -ra

      # ============================================================
      # 12. CREATE VALIDATION REPORT
      # ============================================================
      - name: Create validation report
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$ARTIFACT_DIR/reports/A227C-VALIDATION-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "CI VALIDATION REPORT"
            echo "===================="
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Project root:"
            echo "$PROJECT_DIR"
            echo ""
            echo "Python:"
            python --version
            echo ""
            echo "Backend:"
            echo "VALIDATED"
            echo ""
            echo "Compilation:"
            echo "PASSED"
            echo ""
            echo "Tests:"
            echo "PASSED"
          } > "$REPORT"

          test -s "$REPORT"

          echo ""
          cat "$REPORT"

      # ============================================================
      # 13. PACKAGE COMPLETE SOURCE
      # ============================================================
      - name: Package complete A227C source
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          cd "$PROJECT_DIR"

          zip -qr "$SOURCE_ZIP" . \
            -x ".git/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".pytest_cache/*"

          test -s "$SOURCE_ZIP"

          echo ""
          echo "SOURCE ZIP CREATED:"
          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 14. DETECT REAL ANDROID PROJECT
      # ============================================================
      - name: Detect Android application
        id: android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_ROOT=""

          while IFS= read -r app_dir; do

            parent="$(dirname "$app_dir")"

            if [ ! -f "$app_dir/build.gradle" ] && \
               [ ! -f "$app_dir/build.gradle.kts" ]; then
              continue
            fi

            if [ ! -f "$parent/settings.gradle" ] && \
               [ ! -f "$parent/settings.gradle.kts" ]; then
              continue
            fi

            if grep -Rqs \
              "com.android.application" \
              "$parent"/*.gradle \
              "$parent"/*.gradle.kts \
              "$app_dir"/*.gradle \
              "$app_dir"/*.gradle.kts \
              2>/dev/null; then

              ANDROID_ROOT="$parent"
              break
            fi

          done < <(
            find "$PROJECT_DIR" \
              -type d \
              -name "app" \
              -not -path "*/.git/*" \
              | sort
          )

          if [ -n "$ANDROID_ROOT" ]; then

            echo "ANDROID PROJECT FOUND:"
            echo "$ANDROID_ROOT"

            echo "android_available=true" >> "$GITHUB_OUTPUT"
            echo "android_root=$ANDROID_ROOT" >> "$GITHUB_OUTPUT"

          else

            echo "No Android application was found in the actual A227C source."

            echo "android_available=false" >> "$GITHUB_OUTPUT"
            echo "android_root=" >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # 15. JAVA 17
      # ============================================================
      - name: Set up Java 17
        if: steps.android.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 16. GRADLE 8.7
      # ============================================================
      - name: Set up Gradle 8.7
        if: steps.android.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ============================================================
      # 17. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        if: steps.android.outputs.android_available == 'true'
        env:
          ANDROID_ROOT: ${{ steps.android.outputs.android_root }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

          DEBUG_APK="$(
            find "$ANDROID_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*debug*.apk" \
              | head -1
          )"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not produced."
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR/android"

          cp "$DEBUG_APK" \
            "$ARTIFACT_DIR/android/A227C-debug.apk"

          test -s "$ARTIFACT_DIR/android/A227C-debug.apk"

          echo "DEBUG APK VERIFIED:"
          ls -lh "$ARTIFACT_DIR/android/A227C-debug.apk"

      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        if: steps.android.outputs.android_available == 'true'
        env:
          ANDROID_ROOT: ${{ steps.android.outputs.android_root }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            gradle --no-daemon assembleRelease
          fi

          RELEASE_APK="$(
            find "$ANDROID_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*release*.apk" \
              | head -1
          )"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not produced."
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR/android"

          cp "$RELEASE_APK" \
            "$ARTIFACT_DIR/android/A227C-release.apk"

          test -s "$ARTIFACT_DIR/android/A227C-release.apk"

          echo "RELEASE APK VERIFIED:"
          ls -lh "$ARTIFACT_DIR/android/A227C-release.apk"

      # ============================================================
      # 19. FINAL ARTIFACT VERIFICATION
      # ============================================================
      - name: Verify final artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "FINAL A227C ARTIFACT VERIFICATION"
          echo "============================================================"

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"
          REPORT="$ARTIFACT_DIR/reports/A227C-VALIDATION-REPORT.txt"

          echo ""
          echo "Artifact directory:"
          find "$ARTIFACT_DIR" \
            -type f \
            -printf '%p — %s bytes\n' \
            | sort

          echo ""

          # Mandatory source artifact.
          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Mandatory source ZIP is missing."
            exit 1
          fi

          # Mandatory report.
          if [ ! -s "$REPORT" ]; then
            echo "ERROR: Validation report is missing."
            exit 1
          fi

          # If Android was detected, both APKs MUST exist.
          if [ "${{ steps.android.outputs.android_available }}" = "true" ]; then

            if [ ! -s "$ARTIFACT_DIR/android/A227C-debug.apk" ]; then
              echo "ERROR: Android was detected but Debug APK is missing."
              exit 1
            fi

            if [ ! -s "$ARTIFACT_DIR/android/A227C-release.apk" ]; then
              echo "ERROR: Android was detected but Release APK is missing."
              exit 1
            fi

            echo "Android Debug APK: VERIFIED"
            echo "Android Release APK: VERIFIED"

          else

            echo "Android application: NOT PRESENT IN CURRENT SOURCE"
            echo "No APK is being falsely claimed."

          fi

          echo ""
          echo "ALL EXPECTED ARTIFACTS VERIFIED."

      # ============================================================
      # 20. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload A227C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A227C-BUILD-${{ github.run_number }}
          path: ${{ github.workspace }}/a227c-artifacts
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 21. FINAL SUCCESS
      # ============================================================
      - name: Final success
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "A227C BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "Backend validation: PASSED"
          echo "Compilation: PASSED"
          echo "Tests: PASSED"
          echo "Complete source ZIP: VERIFIED"
          echo "Validation report: VERIFIED"
          echo "GitHub artifact upload: COMPLETED"

          if [ "${{ steps.android.outputs.android_available }}" = "true" ]; then
            echo "Debug APK: VERIFIED"
            echo "Release APK: VERIFIED"
          else
            echo "Android APK: NOT APPLICABLE — NO ANDROID MODULE IN SOURCE"
          fi
