
name: UNIVERSAL-TRADING-BOT-A227C - Final Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - '*.zip'

permissions:
  contents: read

concurrency:
  group: a227c-final-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.7"
  ANDROID_API_LEVEL: "35"
  SOURCE_ARCHIVE: "UNIVERSAL-TRADING-BOT-A227C-FINAL-PRODUCTION-SOURCE-RESEARCH-COMPLETE.zip"

jobs:
  build:
    name: Validate and Build A227C
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$SOURCE_ARCHIVE" ]]; then
            echo "::error::Source archive not found: $SOURCE_ARCHIVE"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/a227c-extracted"
          unzip -q "$SOURCE_ARCHIVE" -d "$GITHUB_WORKSPACE/a227c-extracted"

          echo "Source archive extracted successfully."

      - name: Locate A227C project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/a227c-extracted"

          INDICATOR="$(find "$SEARCH_ROOT" \
            -type f \
            -path '*/backend/a227c/core/indicators.py' \
            -print -quit)"

          if [[ -z "$INDICATOR" ]]; then
            echo "::error::A227C backend source was not found."
            find "$SEARCH_ROOT" -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$INDICATOR")")")")"

          if [[ ! -d "$PROJECT_ROOT/backend/a227c" ]]; then
            echo "::error::Invalid project root: $PROJECT_ROOT"
            exit 1
          fi

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Located project: $PROJECT_ROOT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest numpy pandas fastapi uvicorn pydantic

      - name: Validate required source files
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            backend/a227c/core/indicators.py
            backend/a227c/core/research_candidates.py
            backend/a227c/providers/symbol_discovery.py
            backend/a227c/research/statistics.py
            backend/a227c/research/tick_replay.py
            backend/a227c/research/duration_calibration.py
            backend/a227c/research/swap_ledger.py
            backend/a227c/research/strategy_candidates.py
            backend/a227c/research/shadow.py
            backend/a227c/research/acceptance.py
            backend/a227c/research/validate_all.py
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done

          if [[ ! -d backend/tests ]]; then
            echo "::error::Backend tests directory missing."
            exit 1
          fi

      - name: Validate backend imports
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib

          modules = [
              "a227c.core.indicators",
              "a227c.core.research_candidates",
              "a227c.providers.symbol_discovery",
              "a227c.research.statistics",
              "a227c.research.tick_replay",
              "a227c.research.duration_calibration",
              "a227c.research.swap_ledger",
              "a227c.research.strategy_candidates",
              "a227c.research.shadow",
              "a227c.research.acceptance",
              "a227c.research.validate_all",
          ]

          for module in modules:
              importlib.import_module(module)
              print("IMPORT OK:", module)

          print("All required imports passed.")
          PY

      - name: Compile Python source
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/a227c
          echo "Python compilation passed."

      - name: Run complete backend tests
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        run: |
          set -euo pipefail

          python -m pytest backend/tests \
            -v \
            --tb=short \
            --junitxml=a227c-backend-test-results.xml

      - name: Validate five-market coverage across backend
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          required_markets = (
              "XAUUSD",
              "USTECH100",
              "GBPJPY",
              "GBPUSD",
              "USDJPY",
          )

          backend = Path("backend")

          extensions = {
              ".py", ".json", ".yaml", ".yml",
              ".toml", ".md", ".txt"
          }

          files = [
              path for path in backend.rglob("*")
              if path.is_file()
              and path.suffix.lower() in extensions
              and "__pycache__" not in path.parts
          ]

          if not files:
              raise SystemExit("Backend source files were not found.")

          contents = {}

          for path in files:
              try:
                  contents[path] = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              except OSError as error:
                  raise SystemExit(
                      f"Unable to inspect {path}: {error}"
                  )

          missing = []

          for market in required_markets:
              matches = [
                  str(path)
                  for path, source in contents.items()
                  if market in source
              ]

              if not matches:
                  missing.append(market)
                  continue

              print(f"MARKET IDENTIFIER FOUND: {market}")

              for match in matches[:5]:
                  print("  ", match)

          if missing:
              raise SystemExit(
                  "Missing market identifiers: "
                  + ", ".join(missing)
              )

          print("All five market identifiers found across backend.")
          PY

      - name: Validate no broker order execution calls
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = {
              "order_send",
              "order_modify",
              "order_delete",
          }

          runtime = Path("backend/a227c")
          violations = []

          for path in runtime.rglob("*.py"):
              try:
                  tree = ast.parse(
                      path.read_text(encoding="utf-8"),
                      filename=str(path)
                  )
              except (OSError, SyntaxError, UnicodeDecodeError):
                  continue

              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue

                  if isinstance(node.func, ast.Attribute):
                      if node.func.attr in forbidden:
                          violations.append(
                              f"{path}:{node.lineno}: {node.func.attr}"
                          )

          if violations:
              print("\n".join(violations))
              raise SystemExit("Broker execution call detected.")

          print("No forbidden broker execution calls detected.")
          PY

      - name: Validate production configuration
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="backend/config.production.example.json"

          if [[ -f "$CONFIG" ]]; then
            python -m json.tool "$CONFIG" >/dev/null
            echo "Production configuration JSON valid."
          else
            echo "::warning::Production configuration example not present."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate Android Gradle project
        id: android
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_WRAPPER="$(find . \
            -type f \
            -name gradlew \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [[ -z "$GRADLE_WRAPPER" ]]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$GRADLE_WRAPPER")"

          if [[ ! -f "$GRADLE_ROOT/settings.gradle" && \
                ! -f "$GRADLE_ROOT/settings.gradle.kts" ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          MANIFEST="$(find "$GRADLE_ROOT" \
            -type f \
            -name AndroidManifest.xml \
            -not -path '*/build/*' \
            -print -quit)"

          if [[ -z "$MANIFEST" ]]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          chmod +x "$GRADLE_WRAPPER"

          echo "root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $GRADLE_ROOT"

      - name: Configure Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      - name: Build Debug and Release APKs
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            assembleRelease

      - name: Locate and validate APKs
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_ROOT="${{ steps.android.outputs.root }}"

          DEBUG_APK="$(find "$GRADLE_ROOT" \
            -type f \
            -path '*/build/outputs/apk/*/debug/*.apk' \
            -print -quit)"

          RELEASE_APK="$(find "$GRADLE_ROOT" \
            -type f \
            -path '*/build/outputs/apk/*/release/*.apk' \
            -print -quit)"

          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p artifacts

          cp "$DEBUG_APK" artifacts/A227C-DEBUG.apk
          cp "$RELEASE_APK" artifacts/A227C-RELEASE.apk

          echo "debug=artifacts/A227C-DEBUG.apk" >> "$GITHUB_OUTPUT"
          echo "release=artifacts/A227C-RELEASE.apk" >> "$GITHUB_OUTPUT"

          ls -lh artifacts/*.apk

      - name: Generate APK checksums
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts

          sha256sum \
            A227C-DEBUG.apk \
            A227C-RELEASE.apk \
            > APK-SHA256SUMS.txt

          cat APK-SHA256SUMS.txt

      - name: Package validated source
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          zip -qr \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            . \
            -x "*/__pycache__/*" \
               "*/.pytest_cache/*" \
               "*/.gradle/*" \
               "*/build/*" \
               "*/.git/*" \
               "artifacts/*" \
               "*.pyc" \
               "*.pyo"

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.sha256

          ls -lh artifacts/

      - name: Generate final build report
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          REPORT="artifacts/A227C-FINAL-BUILD-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "FINAL BUILD REPORT"
            echo "======================================"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "UTC: $(date -u)"
            echo
            echo "Runner: ubuntu-22.04"
            echo "Python: 3.11"
            echo "Java: 17"
            echo "Gradle: 8.7"
            echo "Android API: 35"
            echo
            echo "Backend tests: PASSED"
            echo "Python compilation: PASSED"
            echo "Imports: PASSED"
            echo "Five-market identifier scan: PASSED"
            echo "Broker execution scan: PASSED"
            echo "Debug APK: BUILT"
            echo "Release APK: BUILT"
            echo
            echo "This CI report does not certify live MT5 connectivity,"
            echo "Exness authentication, WSS/TLS deployment, physical"
            echo "Android acceptance, strategy profitability, or Play"
            echo "Protect approval."
            echo
            echo "END OF REPORT"
          } > "$REPORT"

          cat "$REPORT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Debug-APK
          path: ${{ steps.project.outputs.root }}/artifacts/A227C-DEBUG.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Release-APK
          path: ${{ steps.project.outputs.root }}/artifacts/A227C-RELEASE.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated source and reports
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Validated-Source-and-Reports
          path: |
            ${{ steps.project.outputs.root }}/artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip
            ${{ steps.project.outputs.root }}/artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.sha256
            ${{ steps.project.outputs.root }}/artifacts/APK-SHA256SUMS.txt
            ${{ steps.project.outputs.root }}/artifacts/A227C-FINAL-BUILD-REPORT.txt
            ${{ steps.project.outputs.root }}/a227c-backend-test-results.xml
          if-no-files-found: error
          retention-days: 30
          
