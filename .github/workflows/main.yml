name: Build UNIVERSAL-TRADING-BOT-A227C Revision 1.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: a227c-revision-1-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: A227C Revision 1.6 Complete Build
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      SOURCE_ARCHIVE: UNIVERSAL-TRADING-BOT-A227C-REVISION-1.6-EXNESS-PIPELINE-HARDENED.zip
      SOURCE_DIR: ${{ github.workspace }}/a227c-source
      ARTIFACT_DIR: ${{ github.workspace }}/a227c-artifacts

    steps:

      # ================================================
      # 1. CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ================================================
      # 2. INITIALIZE DIRECTORIES
      # ================================================

      - name: Initialize build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR" "$ARTIFACT_DIR"

          mkdir -p "$SOURCE_DIR"
          mkdir -p "$ARTIFACT_DIR/source"
          mkdir -p "$ARTIFACT_DIR/reports"
          mkdir -p "$ARTIFACT_DIR/android"

          echo "A227C Revision 1.6 build initialized."

      # ================================================
      # 3. SET UP JAVA 17
      # ================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ================================================
      # 4. INSTALL GRADLE 8.7
      # ================================================

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle-8.7.zip

          unzip -q /tmp/gradle-8.7.zip -d /opt

          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      # ================================================
      # 5. SET UP ANDROID SDK API 35
      # ================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK location unavailable."
            exit 1
          fi

          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo "Android SDK verified: $SDK"

      # ================================================
      # 6. LOCATE EXACT REVISION 1.6 ARCHIVE
      # ================================================

      - name: Locate Revision 1.6 source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""

          while IFS= read -r -d '' candidate; do
            if [ -n "$ARCHIVE" ]; then
              echo "ERROR: Multiple Revision 1.6 archives found."
              echo "$ARCHIVE"
              echo "$candidate"
              exit 1
            fi

            ARCHIVE="$candidate"

          done < <(
            find "$GITHUB_WORKSPACE" \
              -path "$GITHUB_WORKSPACE/.git" -prune -o \
              -path "$SOURCE_DIR" -prune -o \
              -path "$ARTIFACT_DIR" -prune -o \
              -type f \
              -name "$SOURCE_ARCHIVE" \
              -print0
          )

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Exact Revision 1.6 archive not found."
            echo "Required: $SOURCE_ARCHIVE"
            exit 1
          fi

          echo "Selected Revision 1.6 archive:"
          echo "$ARCHIVE"

          unzip -t "$ARCHIVE"

          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # ================================================
      # 7. DETECT A227C PROJECT ROOT
      # ================================================

      - name: Locate and verify A227C project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            candidate="${file%/backend/a227c/core/indicators.py}"

            if [ -f "$candidate/backend/a227c/core/indicators.py" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$SOURCE_DIR" \
              -type f \
              -path '*/backend/a227c/core/indicators.py' \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: A227C backend indicator module missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/backend/a227c" ]; then
            echo "ERROR: A227C backend package missing."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PROJECT_DIR/backend" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "A227C project root verified:"
          echo "$PROJECT_DIR"

      # ================================================
      # 8. VERIFY ANDROID APPLICATION
      # ================================================

      - name: Detect mandatory Android application
        id: android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_ROOT=""
          MODULE_DIR=""

          while IFS= read -r -d '' candidate; do

            current="$(dirname "$candidate")"

            while :; do

              if [ -f "$current/settings.gradle" ] ||
                 [ -f "$current/settings.gradle.kts" ]; then

                ANDROID_ROOT="$current"
                MODULE_DIR="$(dirname "$candidate")"
                break
              fi

              if [ "$current" = "$PROJECT_DIR" ] ||
                 [ "$current" = "/" ]; then
                break
              fi

              case "$current/" in
                "$PROJECT_DIR/"*)
                  current="$(dirname "$current")"
                  ;;
                *)
                  break
                  ;;
              esac

            done

            if [ -n "$ANDROID_ROOT" ]; then
              break
            fi

          done < <(
            find "$PROJECT_DIR" \
              -path '*/.gradle' -prune -o \
              -path '*/build' -prune -o \
              -type f \
              \( -path '*/app/build.gradle' -o \
                 -path '*/app/build.gradle.kts' \) \
              -print0
          )

          if [ -z "$ANDROID_ROOT" ] || [ -z "$MODULE_DIR" ]; then
            echo "ERROR: Mandatory Android project not detected."
            exit 1
          fi

          APP_GRADLE=""

          if [ -f "$MODULE_DIR/build.gradle.kts" ]; then
            APP_GRADLE="$MODULE_DIR/build.gradle.kts"
          elif [ -f "$MODULE_DIR/build.gradle" ]; then
            APP_GRADLE="$MODULE_DIR/build.gradle"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Android module Gradle file missing."
            exit 1
          fi

          if ! grep -Eq \
            'com\.android\.application|libs\.plugins\.android\.application|alias[[:space:]]*\([[:space:]]*libs\.plugins\.android\.application' \
            "$APP_GRADLE"; then
            echo "ERROR: Android application plugin not detected."
            exit 1
          fi

          MODULE_RELATIVE="${MODULE_DIR#"$ANDROID_ROOT"/}"

          if [ "$MODULE_RELATIVE" = "$MODULE_DIR" ] ||
             [ -z "$MODULE_RELATIVE" ]; then
            echo "ERROR: Android module is outside Gradle root."
            exit 1
          fi

          MODULE_TASK_PATH=":$(printf '%s' "$MODULE_RELATIVE" | tr '/' ':')"

          MANIFEST="$MODULE_DIR/src/main/AndroidManifest.xml"
          LOGO="$MODULE_DIR/src/main/res/drawable-nodpi/a227c_logo.png"

          if [ ! -s "$MANIFEST" ]; then
            echo "ERROR: Android manifest missing."
            exit 1
          fi

          if ! find "$MODULE_DIR/src/main" \
            -type f \( -name '*.kt' -o -name '*.java' \) \
            -print -quit | grep -q .; then
            echo "ERROR: Android source files missing."
            exit 1
          fi

          if [ ! -s "$LOGO" ]; then
            echo "ERROR: Official A227C logo missing."
            find "$MODULE_DIR/src/main/res" -type f -print || true
            exit 1
          fi

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "MODULE_DIR=$MODULE_DIR" >> "$GITHUB_ENV"
          echo "MODULE_TASK_PATH=$MODULE_TASK_PATH" >> "$GITHUB_ENV"

          echo "Android project root: $ANDROID_ROOT"
          echo "Android module: $MODULE_DIR"
          echo "Gradle module path: $MODULE_TASK_PATH"
          echo "Android manifest verified."
          echo "Official A227C logo verified."

      # ================================================
      # 9. SET UP PYTHON 3.11
      # ================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ================================================
      # 10. INSTALL BACKEND DEPENDENCIES
      # ================================================

      - name: Install A227C Python dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install numpy

          REQUIREMENTS_FILES=(
            "$PROJECT_DIR/backend/requirements.txt"
            "$PROJECT_DIR/requirements.txt"
            "$PROJECT_DIR/backend/requirements-dev.txt"
            "$PROJECT_DIR/requirements-dev.txt"
          )

          for REQUIREMENTS in "${REQUIREMENTS_FILES[@]}"; do
            if [ -f "$REQUIREMENTS" ]; then
              echo "Installing $REQUIREMENTS"
              python -m pip install -r "$REQUIREMENTS"
            fi
          done

          if [ -f "$PROJECT_DIR/backend/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR/backend"
          elif [ -f "$PROJECT_DIR/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR"
          fi

          python -m pip install pytest pytest-asyncio httpx

          python -c "import numpy; print('NumPy:', numpy.__version__)"

          python -m pip check

      # ================================================
      # 11. VERIFY BACKEND IMPORTS
      # ================================================

      - name: Verify A227C imports
        id: imports
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -c "import a227c"
          python -c "import a227c.core.indicators"

          echo "A227C imports verified."

      # ================================================
      # 12. COMPILE PYTHON
      # ================================================

      - name: Compile A227C Python source
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m compileall -q backend/a227c

          echo "Python compilation successful."

      # ================================================
      # 13. RUN AUTOMATED TESTS
      # ================================================

      - name: Run A227C automated tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mapfile -t TEST_FILES < <(
            find . \
              -path './.git' -prune -o \
              -path './.venv' -prune -o \
              -path './venv' -prune -o \
              -path '*/__pycache__' -prune -o \
              -path '*/.pytest_cache' -prune -o \
              -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -print
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No automated test files found."
            exit 1
          fi

          echo "Found ${#TEST_FILES[@]} test files."

          python -m pytest -v "${TEST_FILES[@]}"

          echo "A227C tests passed."

      # ================================================
      # 14. PACKAGE COMPLETE SOURCE
      # ================================================

      - name: Package complete A227C source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-REVISION-1.6-COMPLETE-SOURCE.zip"

          mkdir -p "$(dirname "$OUTPUT")"

          cd "$PROJECT_DIR"

          zip -qr "$OUTPUT" . \
            -x "./.git/*" \
            -x "./.venv/*" \
            -x "./venv/*" \
            -x "./__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "./.pytest_cache/*" \
            -x "*/.pytest_cache/*" \
            -x "*/build/*" \
            -x "*/.gradle/*"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Source ZIP missing."
            exit 1
          fi

          unzip -tq "$OUTPUT"

          echo "Source ZIP verified:"
          ls -lh "$OUTPUT"

          echo "package_ready=true" >> "$GITHUB_OUTPUT"

      # ================================================
      # 15. VERIFY GRADLE
      # ================================================

      - name: Verify Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

      # ================================================
      # 16. VERIFY GRADLE MODULE
      # ================================================

      - name: Verify Android Gradle module
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          gradle \
            --no-daemon \
            --console=plain \
            projects

          gradle \
            --no-daemon \
            --console=plain \
            help \
            --task "$MODULE_TASK_PATH:assembleDebug"

      # ================================================
      # 17. CLEAN ANDROID PROJECT
      # ================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          gradle \
            --no-daemon \
            -p "$ANDROID_ROOT" \
            "$MODULE_TASK_PATH:clean" \
            --stacktrace

      # ================================================
      # 18. BUILD DEBUG APK
      # ================================================

      - name: Build Debug APK
        id: debug
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          gradle \
            --no-daemon \
            -p "$ANDROID_ROOT" \
            "$MODULE_TASK_PATH:assembleDebug" \
            --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$MODULE_DIR/build/outputs/apk/debug"

          APK="$(find "$APK_DIR" \
            -type f -name '*.apk' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK missing."
            find "$MODULE_DIR/build/outputs" -type f -print || true
            exit 1
          fi

          echo "Debug APK verified:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Debug-APK
          path: ${{ env.MODULE_DIR }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ================================================
      # 19. BUILD RELEASE APK
      # ================================================

      - name: Build Release APK
        id: release
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          gradle \
            --no-daemon \
            -p "$ANDROID_ROOT" \
            "$MODULE_TASK_PATH:assembleRelease" \
            --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$MODULE_DIR/build/outputs/apk/release"

          APK="$(find "$APK_DIR" \
            -type f -name '*.apk' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Release APK missing."
            find "$MODULE_DIR/build/outputs" -type f -print || true
            exit 1
          fi

          echo "Release APK verified:"
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Release-APK
          path: ${{ env.MODULE_DIR }}/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # ================================================
      # 20. GENERATE BUILD REPORT
      # ================================================

      - name: Generate A227C build report
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
          PROJECT_RESULT: ${{ steps.project.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          IMPORT_RESULT: ${{ steps.imports.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          DEBUG_RESULT: ${{ steps.debug.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR/reports"

          REPORT="$ARTIFACT_DIR/reports/A227C-REVISION-1.6-BUILD-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "REVISION 1.6 BUILD AND VALIDATION REPORT"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: ubuntu-22.04"
            echo "Java: 17"
            echo "Gradle: 8.7"
            echo "Android SDK: API 35"
            echo
            echo "Source discovery: ${SOURCE_RESULT:-not completed}"
            echo "Project verification: ${PROJECT_RESULT:-not completed}"
            echo "Android verification: ${ANDROID_RESULT:-not completed}"
            echo "Dependencies: ${DEPENDENCY_RESULT:-not completed}"
            echo "Imports: ${IMPORT_RESULT:-not completed}"
            echo "Compilation: ${COMPILE_RESULT:-not completed}"
            echo "Automated tests: ${TEST_RESULT:-not completed}"
            echo "Source packaging: ${PACKAGE_RESULT:-not completed}"
            echo "Debug APK: ${DEBUG_RESULT:-not completed}"
            echo "Release APK: ${RELEASE_RESULT:-not completed}"
            echo
            echo "Overall job status: ${JOB_STATUS:-unknown}"
            echo
            echo "A successful build does not establish live"
            echo "broker connectivity or physical-device acceptance."
            echo
            echo "A227C is a signal-analysi
