name: A227C Complete Build and Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: a227c-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate A227C and Build Android APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"
      GRADLE_VERSION: "8.7"
      ANDROID_API: "35"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # LOCATE AND EXTRACT THE ACTUAL A227C SOURCE ZIP
      # ============================================================

      - name: Locate and extract A227C source archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="UNIVERSAL-TRADING-BOT-A227C-FINAL-PRODUCTION-SOURCE-RESEARCH-COMPLETE.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::A227C source archive not found:"
            echo "$ARCHIVE"
            echo
            echo "Repository contents:"
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          SOURCE_DIR="$GITHUB_WORKSPACE/a227c-source"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

          BACKEND_FILE="$(
            find "$SOURCE_DIR" \
              -type f \
              -path '*/backend/a227c/core/indicators.py' \
              -print -quit
          )"

          if [[ -z "$BACKEND_FILE" ]]; then
            echo "::error::The extracted archive does not contain:"
            echo "backend/a227c/core/indicators.py"
            echo
            echo "Extracted contents:"
            find "$SOURCE_DIR" -maxdepth 6 -type f -print | sort | head -300
            exit 1
          fi

          PROJECT_ROOT="${BACKEND_FILE%/backend/a227c/core/indicators.py}"

          if [[ ! -d "$PROJECT_ROOT/backend/a227c" ]]; then
            echo "::error::Invalid A227C project root:"
            echo "$PROJECT_ROOT"
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "A227C archive found."
          echo "A227C project root:"
          echo "$PROJECT_ROOT"

      # ============================================================
      # DISCOVER ANDROID PROJECT
      # ============================================================

      - name: Discover Android project
        id: discover
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$PWD"

          SETTINGS_FILE="$(
            find "$PROJECT_ROOT" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit
          )"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$SETTINGS_FILE")"

          APP_BUILD_FILE="$(
            find "$GRADLE_ROOT" \
              -type f \
              \( \
                -path '*/android/app/build.gradle' \
                -o -path '*/android/app/build.gradle.kts' \
                -o -path '*/app/build.gradle' \
                -o -path '*/app/build.gradle.kts' \
              \) \
              -print -quit
          )"

          if [[ -z "$APP_BUILD_FILE" ]]; then
            echo "::error::Android application module not found."
            exit 1
          fi

          APP_DIR="$(dirname "$APP_BUILD_FILE")"

          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          LOGO="$(
            find "$APP_DIR/src/main/res" \
              -type f \
              \( \
                -iname 'a227c_logo.png' \
                -o -iname 'siyoma_logo.png' \
                -o -iname '*a227c*logo*.png' \
                -o -iname '*siyoma*logo*.png' \
              \) \
              -print -quit
          )"

          if [[ -z "$LOGO" ]]; then
            echo "::error::A227C/SIYOMA logo not found."
            exit 1
          fi

          RELATIVE_APP="${APP_DIR#"$GRADLE_ROOT"/}"
          MODULE_TASK=":${RELATIVE_APP//\//:}"

          echo "gradle_root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "module_task=$MODULE_TASK" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "logo=$LOGO" >> "$GITHUB_OUTPUT"

          echo "Gradle root: $GRADLE_ROOT"
          echo "Android module: $MODULE_TASK"
          echo "Manifest: $MANIFEST"
          echo "Logo: $LOGO"

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Install backend requirements
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
          fi

      # ============================================================
      # REQUIRED SOURCE COMPONENTS
      # ============================================================

      - name: Validate required A227C source components
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "backend/a227c/core/indicators.py"
            "backend/a227c/core/strategies.py"
            "backend/a227c/core/research_candidates.py"

            "backend/a227c/research/run_research.py"
            "backend/a227c/research/candidate_backtest.py"
            "backend/a227c/research/tick_replay.py"
            "backend/a227c/research/statistics.py"
            "backend/a227c/research/duration_calibration.py"
            "backend/a227c/research/swap_ledger.py"
            "backend/a227c/research/shadow.py"
            "backend/a227c/research/acceptance.py"
            "backend/a227c/research/validate_all.py"

            "backend/a227c/providers/symbol_discovery.py"

            "backend/a227c/adapters/mt5_adapter.py"
            "backend/a227c/adapters/deriv_adapter.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required A227C component missing:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "All required A227C components are present."

      # ============================================================
      # IMPORT VALIDATION
      # ============================================================

      - name: Verify backend imports
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          from a227c.core.indicators import *
          from a227c.core.strategies import *
          from a227c.core.research_candidates import *

          from a227c.research.run_research import *
          from a227c.research.candidate_backtest import *
          from a227c.research.tick_replay import *
          from a227c.research.statistics import *
          from a227c.research.duration_calibration import *
          from a227c.research.swap_ledger import *
          from a227c.research.shadow import *
          from a227c.research.acceptance import *
          from a227c.research.validate_all import *

          from a227c.providers.symbol_discovery import *

          from a227c.adapters.mt5_adapter import *
          from a227c.adapters.deriv_adapter import *

          print("A227C backend imports successful.")
          PY

      # ============================================================
      # PYTHON COMPILE
      # ============================================================

      - name: Compile Python modules
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q backend/a227c

          echo "Python compilation successful."

      # ============================================================
      # COMPLETE BACKEND TEST SUITE
      # ============================================================

      - name: Run complete backend tests
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          if [[ -d backend/tests ]]; then
            python -m pytest backend/tests -v
          elif [[ -d tests ]]; then
            python -m pytest tests -v
          else
            echo "::error::Backend test directory not found."
            exit 1
          fi

      # ============================================================
      # FIVE-MARKET RESEARCH COVERAGE
      # ============================================================

      - name: Validate five-market research coverage
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          from a227c.core.research_candidates import (
              RESEARCH_CANDIDATES,
              list_research_candidates,
          )

          required = {
              "XAUUSD",
              "USTECH100",
              "GBPJPY",
              "GBPUSD",
              "USDJPY",
          }

          missing = required - set(RESEARCH_CANDIDATES.keys())

          if missing:
              raise SystemExit(
                  "Missing research markets: "
                  + ", ".join(sorted(missing))
              )

          total = 0

          for symbol in sorted(required):
              candidates = list_research_candidates(symbol)

              if not candidates:
                  raise SystemExit(
                      f"No research candidates registered for {symbol}"
                  )

              print(
                  f"{symbol}: "
                  f"{len(candidates)} research candidates"
              )

              total += len(candidates)

          print(
              f"Total registered research candidates: {total}"
          )
          PY

      # ============================================================
      # SIGNAL-ONLY SAFETY CHECK
      # ============================================================

      - name: Verify signal-only architecture
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning A227C source for broker execution calls..."

          if grep -RInE \
            --include='*.py' \
            --exclude-dir='__pycache__' \
            '(^|[^A-Za-z0-9_])(mt5\.order_send|order_send\(|order_modify\(|order_delete\()' \
            backend/a227c; then

            echo "::error::Broker trade execution call detected."
            exit 1
          fi

          echo "No broker trade execution calls detected."

      # ============================================================
      # RESEARCH PREREQUISITE AUDIT
      # ============================================================

      - name: Run research prerequisite audit
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python -m a227c.research.validate_all

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project structure
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.discover.outputs.app_dir }}"
          MANIFEST="${{ steps.discover.outputs.manifest }}"
          LOGO="${{ steps.discover.outputs.logo }}"

          test -f "$MANIFEST"
          test -f "$LOGO"

          if [[ ! -f "$APP/build.gradle" ]] &&
             [[ ! -f "$APP/build.gradle.kts" ]]; then
            echo "::error::Android build file missing."
            exit 1
          fi

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
          else
            echo "No Gradle wrapper supplied; using Gradle 8.7."
          fi

          command -v gradle

          java -version
          gradle --version

      # ============================================================
      # BOOTSTRAP
      # ============================================================

      - name: Validate optional production bootstrap
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${A227C_BOOTSTRAP_URL:-}" ]]; then
            echo "A227C_BOOTSTRAP_URL is not configured."
            echo "Using the project's existing/default configuration."
            exit 0
          fi

          case "$A227C_BOOTSTRAP_URL" in
            https://*)
              echo "HTTPS bootstrap URL accepted."
              ;;
            *)
              echo "::error::A227C_BOOTSTRAP_URL must use HTTPS."
              exit 1
              ;;
          esac

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android project
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          if [[ -n "${A227C_BOOTSTRAP_URL:-}" ]]; then
            gradle \
              --no-daemon \
              -PA227C_BOOTSTRAP_URL="$A227C_BOOTSTRAP_URL" \
              "${{ steps.discover.outputs.module_task }}:clean"
          else
            gradle \
              --no-daemon \
              "${{ steps.discover.outputs.module_task }}:clean"
          fi

      # ============================================================
      # DEBUG APK
      # ============================================================

      - name: Build Debug APK
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          if [[ -n "${A227C_BOOTSTRAP_URL:-}" ]]; then
            gradle \
              --no-daemon \
              -PA227C_BOOTSTRAP_URL="$A227C_BOOTSTRAP_URL" \
              "${{ steps.discover.outputs.module_task }}:assembleDebug"
          else
            gradle \
              --no-daemon \
              "${{ steps.discover.outputs.module_task }}:assembleDebug"
          fi

      - name: Verify Debug APK
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.discover.outputs.app_dir }}"

          APK="$(
            find "$APP/build/outputs/apk/debug" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [[ -z "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Debug-APK
          path: |
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          if [[ -n "${A227C_BOOTSTRAP_URL:-}" ]]; then
            gradle \
              --no-daemon \
              -PA227C_BOOTSTRAP_URL="$A227C_BOOTSTRAP_URL" \
              "${{ steps.discover.outputs.module_task }}:assembleRelease"
          else
            gradle \
              --no-daemon \
              "${{ steps.discover.outputs.module_task }}:assembleRelease"
          fi

      - name: Verify Release APK
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.discover.outputs.app_dir }}"

          APK="$(
            find "$APP/build/outputs/apk/release" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [[ -z "$APK" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk.sha256

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Releas
