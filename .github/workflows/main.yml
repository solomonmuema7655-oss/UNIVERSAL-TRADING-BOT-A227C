- name: Locate and extract A227C project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_DIR="$WORKSPACE/a227c-extracted"
          PROJECT_DIR=""

          find_android_project() {
            local SEARCH_DIR="$1"

            while IFS= read -r SETTINGS; do
              local DIR
              DIR="$(dirname "$SETTINGS")"

              # A227C uses android/app, not root-level app.
              if [ -f "$DIR/android/app/build.gradle.kts" ] || \
                 [ -f "$DIR/android/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ]; then
                PROJECT_DIR="$DIR"
                return 0
              fi
            done < <(
              find "$SEARCH_DIR" \
                -type d \( -name .git -o -name .gradle -o -name build \) -prune \
                -o -type f \( \
                  -name settings.gradle \
                  -o -name settings.gradle.kts \
                \) -print
            )

            return 1
          }

          echo "Searching for A227C Android project..."

          if ! find_android_project "$WORKSPACE"; then

            echo "Searching for A227C ZIP..."

            ZIP_FILE="$(find "$WORKSPACE" \
              -type f \
              -name 'UNIVERSAL-TRADING-BOT-A227C-FINAL-BUILD.zip' \
              ! -path '*/.git/*' \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find "$WORKSPACE" \
                -type f \
                -iname '*A227C*.zip' \
                ! -iname 'gradle-*.zip' \
                ! -path '*/.git/*' \
                -print -quit || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: A227C ZIP not found."
              find "$WORKSPACE" -maxdepth 5 -type f -print
              exit 1
            fi

            echo "Selected ZIP: $ZIP_FILE"

            unzip -t "$ZIP_FILE"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            if ! find_android_project "$EXTRACT_DIR"; then
              echo "ERROR: A227C Gradle project structure not recognised."
              find "$EXTRACT_DIR" -maxdepth 6 -type f -print
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "A227C Gradle root: $PROJECT_DIR"
          echo "Android module: $PROJECT_DIR/android/app"
