name: UNIVERSAL-TRADING-BOT-A227C — Final Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: a227c-production-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate, Research Audit & Build A227C
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      GRADLE_VERSION: "8.7"
      ANDROID_API_LEVEL: "35"
      SOURCE_ARCHIVE: "UNIVERSAL-TRADING-BOT-A227C-FINAL-PRODUCTION-SOURCE-RESEARCH-COMPLETE.zip"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # LOCATE AUTHORITATIVE SOURCE ARCHIVE
      # ============================================================

      - name: Locate A227C source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="${SOURCE_ARCHIVE}"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Required A227C source archive not found: $ARCHIVE"
            echo "Repository contents:"
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

          echo "Using authoritative source archive:"
          ls -lh "$ARCHIVE"

      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract A227C source
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf a227c-source
          mkdir -p a227c-source

          unzip -q "${{ steps.source.outputs.archive }}" -d a227c-source

          echo "Extracted files:"
          find a227c-source -maxdepth 5 -type f | sort | head -300

          INDICATORS="$(find "$GITHUB_WORKSPACE/a227c-source" \
            -type f \
            -path '*/backend/a227c/core/indicators.py' \
            -print -quit)"

          if [[ -z "$INDICATORS" ]]; then
            echo "::error::Could not locate backend/a227c/core/indicators.py inside source archive."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$INDICATORS")")")")"

          if [[ ! -d "$PROJECT_ROOT/backend" ]]; then
            echo "::error::Derived project root does not contain backend/: $PROJECT_ROOT"
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "A227C project root:"
          echo "$PROJECT_ROOT"

      # ============================================================
      # DISCOVER ANDROID PROJECT
      # ============================================================

      - name: Discover Android project
        id: android
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_ROOT=""

          if [[ -f "./gradlew" ]]; then
            GRADLE_ROOT="$PWD"
          else
            GRADLE="$(find "$PWD" -maxdepth 4 -type f -name gradlew -print -quit)"

            if [[ -n "$GRADLE" ]]; then
              GRADLE_ROOT="$(dirname "$GRADLE")"
            fi
          fi

          if [[ -z "$GRADLE_ROOT" ]]; then
            echo "::error::Could not locate Gradle wrapper."
            find "$PWD" -maxdepth 5 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
            exit 1
          fi

          echo "gradle_root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"

          echo "Gradle root:"
          echo "$GRADLE_ROOT"

          MANIFEST="$(find "$GRADLE_ROOT" -type f -path '*/src/main/AndroidManifest.xml' -print -quit || true)"

          if [[ -z "$MANIFEST" ]]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          APP_DIR="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "Android app directory:"
          echo "$APP_DIR"

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f backend/requirements.txt ]]; then
            pip install -r backend/requirements.txt
          fi

          pip install numpy pandas pytest

      # ============================================================
      # SOURCE STRUCTURE VALIDATION
      # ============================================================

      - name: Validate required A227C components
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "backend/a227c/core/indicators.py"
            "backend/a227c/core/research_candidates.py"
            "backend/a227c/providers/symbol_discovery.py"
            "backend/a227c/research/statistics.py"
            "backend/a227c/research/tick_replay.py"
            "backend/a227c/research/duration_calibration.py"
            "backend/a227c/research/swap_ledger.py"
            "backend/a227c/research/strategy_candidates.py"
            "backend/a227c/research/shadow.py"
            "backend/a227c/research/acceptance.py"
            "backend/a227c/research/validate_all.py"
            "backend/a227c/research/candidate_backtest.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      # ============================================================
      # BACKEND IMPORT VALIDATION
      # ============================================================

      - name: Validate backend imports
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          import sys

          modules = [
              "a227c.core.indicators",
              "a227c.core.research_candidates",
              "a227c.providers.symbol_discovery",
              "a227c.research.statistics",
              "a227c.research.tick_replay",
              "a227c.research.duration_calibration",
              "a227c.research.swap_ledger",
              "a227c.research.strategy_candidates",
              "a227c.research.shadow",
              "a227c.research.acceptance",
              "a227c.research.validate_all",
          ]

          for name in modules:
              __import__(name)
              print(f"IMPORT OK: {name}")
          PY

      # ============================================================
      # PYTHON COMPILE
      # ============================================================

      - name: Compile Python backend
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python -m compileall -q backend

          echo "Python compilation completed successfully."

      # ============================================================
      # FULL BACKEND TEST SUITE
      # ============================================================

      - name: Run complete backend test suite
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python -m pytest -q backend/tests

      # ============================================================
      # FIVE-MARKET RESEARCH COVERAGE
      #
      # IMPORTANT:
      # Do NOT import private/nonexistent names such as
      # RESEARCH_CANDIDATES from research_candidates.py.
      #
      # The project's executable strategy-coverage tests are the
      # authoritative validation for the five logical markets.
      # ============================================================

      - name: Validate five-market research coverage
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          if [[ ! -f backend/tests/test_strategy_coverage.py ]]; then
            echo "::error::Authoritative five-market strategy coverage test is missing."
            exit 1
          fi

          python -m pytest backend/tests/test_strategy_coverage.py -v

      # ============================================================
      # RESEARCH PREREQUISITE AUDIT
      # ============================================================

      - name: Run research prerequisite audit
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python -m a227c.research.validate_all

      # ============================================================
      # SIGNAL-ONLY SAFETY CHECK
      # ============================================================

      - name: Verify no broker execution calls
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning A227C source for broker execution functions..."

          if grep -RniE \
            --exclude-dir='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.zip' \
            'mt5\.order_send|order_send[[:space:]]*\(|order_modify[[:space:]]*\(|order_delete[[:space:]]*\(' \
            backend \
            app 2>/dev/null; then

            echo "::error::Broker execution function detected in A227C source."
            exit 1
          fi

          echo "SIGNAL-ONLY CHECK PASSED."

      # ============================================================
      # PRODUCTION CONFIGURATION CHECK
      # ============================================================

      - name: Validate production configuration
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="backend/config.production.example.json"

          if [[ ! -f "$CONFIG" ]]; then
            echo "::error::Production configuration example missing: $CONFIG"
            exit 1
          fi

          python -m json.tool "$CONFIG" >/dev/null

          echo "Production configuration JSON is valid."

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Validate Gradle wrapper
        working-directory: ${{ steps.android.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -x ./gradlew ]]; then
            chmod +x ./gradlew
          fi

          ./gradlew --version

      # ============================================================
      # ANDROID STRUCTURE
      # ============================================================

      - name: Validate Android structure
        working-directory: ${{ steps.android.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          if [[ ! -f "${{ steps.android.outputs.app_dir }}/src/main/AndroidManifest.xml" ]]; then
            echo "::error::Android manifest not found."
            exit 1
          fi

          echo "Android project structure validated."

      # ============================================================
      # OPTIONAL DEPLOYMENT ENDPOINT VALIDATION
      # ============================================================

      - name: Validate A227C bootstrap URL
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          if [[ -n "${A227C_BOOTSTRAP_URL:-}" ]]; then
            if [[ ! "$A227C_BOOTSTRAP_URL" =~ ^https:// ]]; then
              echo "::error::A227C_BOOTSTRAP_URL must use HTTPS."
              exit 1
            fi

            echo "A227C bootstrap URL supplied and HTTPS validated."
          else
            echo "A227C_BOOTSTRAP_URL not supplied."
            echo "Using application/default configuration."
          fi

      # ============================================================
      # GRADLE BUILD
      # ============================================================

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Build Release APK
        working-directory: ${{ steps.android.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # LOCATE BUILD OUTPUTS
      # ============================================================

      - name: Locate APK outputs
        id: apk
        working-directory: ${{ steps.android.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          RELEASE_APK="$(find . -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"

          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK not found."
            exit 1
          fi

          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          DEBUG_APK="$(realpath "$DEBUG_APK")"
          RELEASE_APK="$(realpath "$RELEASE_APK")"

          echo "debug=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_APK" >> "$GITHUB_OUTPUT"

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo "Release APK:"
          ls -lh "$RELEASE_APK"

      # ============================================================
      # CHECKSUMS
      # ============================================================

      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          sha256sum \
            "${{ steps.apk.outputs.debug }}" \
            "${{ steps.apk.outputs.release }}" \
            > artifacts/APK-SHA256SUMS.txt

          cat artifacts/APK-SHA256SUMS.txt

      # ============================================================
      # PACKAGE EXACT VALIDATED SOURCE
      # ============================================================

      - name: Package validated source
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          cd ..

          zip -qr \
            "$GITHUB_WORKSPACE/artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip" \
            "$(basename "$PWD")" \
            -x '*/__pycache__/*' \
            -x '*/.pytest_cache/*' \
            -x '*.pyc'

      - name: Generate source checksum
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.sha256

          cat artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.sha256

      # ============================================================
      # FINAL BUILD REPORT
      # ============================================================

      - name: Generate final build report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "FINAL PRODUCTION BUILD REPORT"
            echo "========================================"
            echo
            echo "Repository:"
            echo "${GITHUB_REPOSITORY}"
            echo
            echo "Commit:"
            echo "${GITHUB_SHA}"
            echo
            echo "Workflow:"
            echo "${GITHUB_WORKFLOW}"
            echo
            echo "Run:"
            echo "${GITHUB_RUN_ID}"
            echo
            echo "Source archive:"
            echo "${SOURCE_ARCHIVE}"
            echo
            echo "Python:"
            python --version
            echo
            echo "Java:"
            java -version 2>&1 | head -1
            echo
            echo "Gradle:"
            "${{ steps.android.outputs.gradle_root }}/gradlew" --version | grep "Gradle "
            echo
            echo "Android API:"
            echo "${ANDROID_API_LEVEL}"
            echo
            echo "Debug APK:"
            echo "${{ steps.apk.outputs.debug }}"
            echo
            echo "Release APK:"
            echo "${{ steps.apk.outputs.release }}"
            echo
            echo "Five-market coverage:"
            echo "XAUUSD"
            echo "USTECH100"
            echo "GBPJPY"
            echo "GBPUSD"
            echo "USDJPY"
            echo
            echo "Execution:"
            echo "Signal-only — broker order execution prohibited."
            echo
            echo "Production acceptance:"
            echo "External deployment/provider acceptance remains environment-dependent."
            echo "No provider connection or live deployment is claimed by this CI build."
            echo
            echo "BUILD VALIDATION COMPLETED"
          } > artifacts/A227C-FINAL-BUILD-REPORT.txt

          cat artifacts/A227C-FINAL-BUILD-REPORT.txt

      # ============================================================
      # UPLOAD APK ARTIFACTS
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Debug-APK
          path: |
            ${{ steps.apk.outputs.d
