
name: UNIVERSAL-TRADING-BOT-A227C - Final Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: a227c-final-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.9"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  SOURCE_ARCHIVE: "UNIVERSAL-TRADING-BOT-A227C-FINAL-PRODUCTION-SOURCE-RESEARCH-COMPLETE.zip"

jobs:
  build:
    name: Validate and Build A227C
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$SOURCE_ARCHIVE" ]]; then
            echo "::error::Source archive not found: $SOURCE_ARCHIVE"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | sort
            exit 1
          fi

          unzip -tq "$SOURCE_ARCHIVE"
          mkdir -p "$GITHUB_WORKSPACE/a227c-extracted"
          unzip -q "$SOURCE_ARCHIVE" -d "$GITHUB_WORKSPACE/a227c-extracted"

          echo "Source archive integrity check passed."

      - name: Locate A227C project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/a227c-extracted"

          INDICATOR="$(find "$SEARCH_ROOT" -type f \
            -path '*/backend/a227c/core/indicators.py' \
            -print -quit)"

          if [[ -z "$INDICATOR" ]]; then
            echo "::error::A227C backend source was not found."
            find "$SEARCH_ROOT" -maxdepth 7 -type f -print | sort | head -250
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$INDICATOR")")")")"

          if [[ ! -d "$PROJECT_ROOT/backend/a227c" ]]; then
            echo "::error::Invalid A227C project root."
            exit 1
          fi

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Located A227C project: $PROJECT_ROOT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f backend/requirements.txt ]]; then
            echo "::error::backend/requirements.txt is missing."
            exit 1
          fi

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Validate required source files
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            backend/a227c/core/indicators.py
            backend/a227c/core/research_candidates.py
            backend/a227c/providers/symbol_discovery.py
            backend/a227c/research/statistics.py
            backend/a227c/research/tick_replay.py
            backend/a227c/research/duration_calibration.py
            backend/a227c/research/swap_ledger.py
            backend/a227c/research/strategy_candidates.py
            backend/a227c/research/shadow.py
            backend/a227c/research/acceptance.py
            backend/a227c/research/validate_all.py
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required source file is missing: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done

          if [[ ! -d backend/tests ]]; then
            echo "::error::Backend tests directory is missing."
            exit 1
          fi

      - name: Validate backend imports
        working-directory: ${{ steps.project.outputs.root }}
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib

          modules = [
              "a227c.core.indicators",
              "a227c.core.research_candidates",
              "a227c.providers.symbol_discovery",
              "a227c.research.statistics",
              "a227c.research.tick_replay",
              "a227c.research.duration_calibration",
              "a227c.research.swap_ledger",
              "a227c.research.strategy_candidates",
              "a227c.research.shadow",
              "a227c.research.acceptance",
              "a227c.research.validate_all",
          ]

          for module in modules:
              importlib.import_module(module)
              print("IMPORT OK:", module)

          print("All required backend imports passed.")
          PY

      - name: Compile Python source
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/a227c
          echo "Python source compilation passed."

      - name: Run complete backend test suite
        working-directory: ${{ steps.project.outputs.root }}
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest backend/tests \
            -v \
            --tb=short \
            --junitxml=a227c-backend-test-results.xml

      - name: Validate five-market coverage
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          required = ("XAUUSD", "USTECH100", "GBPJPY", "GBPUSD", "USDJPY")
          extensions = {".py", ".json", ".yaml", ".yml", ".toml", ".md", ".txt"}

          files = [
              path for path in Path("backend").rglob("*")
              if path.is_file()
              and path.suffix.lower() in extensions
              and "__pycache__" not in path.parts
          ]

          if not files:
              raise SystemExit("Backend source files were not found.")

          contents = {
              path: path.read_text(encoding="utf-8", errors="replace")
              for path in files
          }

          missing = []
          for market in required:
              matches = [str(path) for path, source in contents.items() if market in source]
              if not matches:
                  missing.append(market)
              else:
                  print("MARKET IDENTIFIER FOUND:", market)

          if missing:
              raise SystemExit("Missing market identifiers: " + ", ".join(missing))

          print("All five required market identifiers were found.")
          PY

      - name: Validate no broker order execution calls
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = {"order_send", "order_modify", "order_delete"}
          violations = []

          for path in Path("backend/a227c").rglob("*.py"):
              tree = ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr in forbidden:
                          violations.append(
                              f"{path}:{node.lineno}: {node.func.attr}"
                          )

          if violations:
              print("\n".join(violations))
              raise SystemExit("Forbidden broker order-execution call detected.")

          print("No forbidden broker order-execution calls detected.")
          PY

      - name: Validate production configuration
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="backend/config.production.example.json"

          if [[ -f "$CONFIG" ]]; then
            python -m json.tool "$CONFIG" >/dev/null
            echo "Production configuration JSON is valid."
          else
            echo "::warning::Optional production configuration example was not found."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API and build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

          echo "Android SDK packages installed."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Locate Android Gradle project
        id: android
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -maxdepth 5 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Gradle settings file was not found."
            find . -maxdepth 6 -type f -print | sort | head -250
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$SETTINGS_FILE")"
          APP_GRADLE="$GRADLE_ROOT/android/app/build.gradle.kts"
          APP_GRADLE_GROOVY="$GRADLE_ROOT/android/app/build.gradle"
          APP_MANIFEST="$GRADLE_ROOT/android/app/src/main/AndroidManifest.xml"

          if [[ ! -f "$APP_GRADLE" && ! -f "$APP_GRADLE_GROOVY" ]]; then
            echo "::error::Android module build file was not found."
            exit 1
          fi

          if [[ ! -f "$APP_MANIFEST" ]]; then
            echo "::error::Android application manifest was not found."
            exit 1
          fi

          echo "root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"
          echo "Located Gradle root: $GRADLE_ROOT"
          echo "Android module: :android:app"

      - name: Verify production bootstrap endpoint
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${A227C_BOOTSTRAP_URL:-}" ]]; then
            echo "::error::Repository Actions secret A227C_BOOTSTRAP_URL is missing."
            echo "Add the real deployed HTTPS endpoint ending in /bootstrap."
            exit 1
          fi

          case "$A227C_BOOTSTRAP_URL" in
            https://*) ;;
            *)
              echo "::error::A227C_BOOTSTRAP_URL must use HTTPS."
              exit 1
              ;;
          esac

          if [[ "$A227C_BOOTSTRAP_URL" != */bootstrap ]]; then
            echo "::error::A227C_BOOTSTRAP_URL must end with /bootstrap."
            exit 1
          fi

          echo "Production bootstrap endpoint format validated."

      - name: Verify installed Gradle
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      - name: Build Android Debug and Release APKs
        working-directory: ${{ steps.android.outputs.root }}
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :android:app:assembleDebug \
            :android:app:assembleRelease

      - name: Locate and validate generated APKs
        id: apk
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="android/app/build/outputs/apk"

          if [[ ! -d "$APK_ROOT" ]]; then
            echo "::error::Android APK output directory was not created."
            exit 1
          fi

          DEBUG_APK="$(find "$APK_ROOT" -type f -path '*/debug/*.apk' -print -quit)"
          RELEASE_APK="$(find "$APK_ROOT" -type f -path '*/release/*.apk' -print -quit)"

          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK was not generated."
            find "$APK_ROOT" -type f -print || true
            exit 1
          fi

          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Release APK was not generated."
            find "$APK_ROOT" -type f -print || true
            exit 1
          fi

          mkdir -p "${{ steps.project.outputs.root }}/artifacts"
          cp "$DEBUG_APK" "${{ steps.project.outputs.root }}/artifacts/A227C-DEBUG.apk"
          cp "$RELEASE_APK" "${{ steps.project.outputs.root }}/artifacts/A227C-RELEASE.apk"

          echo "Debug APK found: $DEBUG_APK"
          echo "Release APK found: $RELEASE_APK"
          ls -lh "${{ steps.project.outputs.root }}"/artifacts/*.apk

      - name: Verify Release APK signing status
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/A227C-RELEASE.apk"
          SIGNING_REPORT="artifacts/A227C-RELEASE-SIGNING-STATUS.txt"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          if [[ -x "$APKSIGNER" ]] && "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "Release APK signature verification: PASSED" > "$SIGNING_REPORT"
          else
            echo "Release APK signature verification: NOT VERIFIED" > "$SIGNING_REPORT"
            echo "Release APK is unsigned or its signature could not be verified."
            echo "A signed Play Store release requires a separately configured signing process."
          fi

          cat "$SIGNING_REPORT"

      - name: Generate checksums and final build report
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts
          sha256sum A227C-DEBUG.apk A227C-RELEASE.apk > APK-SHA256SUMS.txt

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "FINAL CI BUILD REPORT"
            echo "======================================"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "UTC: $(date -u)"
            echo
            echo "Runner: ubuntu-22.04"
            echo "Python: 3.11"
            echo "Java: 17"
            echo "Gradle: 8.9"
            echo "Android API: 35"
            echo
            echo "Backend tests: PASSED (see JUnit report)"
            echo "Python compilation and imports: PASSED"
            echo "Five-market identifier scan: PASSED"
            echo "No-order-execution scan: PASSED"
            echo "Debug APK: BUILT"
            echo "Release APK: BUILT"
            echo
            echo "This report does not certify live broker/provider connectivity,"
            echo "strategy profitability, physical-device acceptance, or Play Store approval."
          } > A227C-FINAL-BUILD-REPORT.txt

          cat APK-SHA256SUMS.txt
          cat A227C-FINAL-BUILD-REPORT.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Debug-APK
          path: ${{ steps.project.outputs.root }}/artifacts/A227C-DEBUG.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Release-APK
          path: ${{ steps.project.outputs.root }}/artifacts/A227C-RELEASE.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Build-Reports
          path: |
            ${{ steps.project.outputs.root }}/artifacts/APK-SHA256SUMS.txt
            ${{ steps.project.outputs.root }}/artifacts/A227C-RELEASE-SIGNING-STATUS.txt
            ${{ steps.project.outputs.root }}/artifacts/A227C-FINAL-BUILD-REPORT.txt
            ${{ steps.project.outputs.root }}/a227c-backend-test-results.xml
          if-no-files-found: error
          retention-days: 30
          
