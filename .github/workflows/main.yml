name: A227C Complete Build and Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: A227C Validation and Build
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. SHOW REPOSITORY CONTENTS
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "A227C REPOSITORY"
          echo "============================================================"

          pwd
          echo ""

          find . -maxdepth 3 -type f \
            \( -name "*.zip" \
            -o -name "pyproject.toml" \
            -o -name "requirements.txt" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -print | sort || true

      # ============================================================
      # 3. DISCOVER A227C SOURCE
      # ============================================================
      - name: Discover A227C source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for A227C source..."

          SOURCE_ARCHIVE=""

          while IFS= read -r candidate; do
            if unzip -t "$candidate" >/dev/null 2>&1; then
              if unzip -Z1 "$candidate" | grep -Eq \
                '(^|/)backend/a227c/|(^|/)a227c/research/|(^|/)a227c_r[0-9]+/backend/a227c/'; then
                SOURCE_ARCHIVE="$candidate"
                break
              fi
            fi
          done < <(find . -type f -name "*.zip" -print | sort)

          if [ -n "$SOURCE_ARCHIVE" ]; then
            echo "Source archive found: $SOURCE_ARCHIVE"
            echo "source_archive=$SOURCE_ARCHIVE" >> "$GITHUB_OUTPUT"
          else
            echo "No separate A227C source archive found."
            echo "The checked-out repository itself will be treated as the A227C source."
            echo "source_archive=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 4. EXTRACT SOURCE ARCHIVE IF PRESENT
      # ============================================================
      - name: Extract A227C source archive
        id: extract
        shell: bash
        env:
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
        run: |
          set -euo pipefail

          if [ -n "$SOURCE_ARCHIVE" ]; then
            rm -rf "$GITHUB_WORKSPACE/a227c-source"
            mkdir -p "$GITHUB_WORKSPACE/a227c-source"

            unzip -q "$SOURCE_ARCHIVE" -d "$GITHUB_WORKSPACE/a227c-source"

            echo "A227C archive extracted."
          else
            mkdir -p "$GITHUB_WORKSPACE/a227c-source"
            rsync -a \
              --exclude ".git" \
              --exclude "a227c-source" \
              ./ "$GITHUB_WORKSPACE/a227c-source/"

            echo "Checked-out repository copied as A227C source."
          fi

          echo "Source tree:"
          find "$GITHUB_WORKSPACE/a227c-source" -maxdepth 4 -type f \
            | sort | head -300

      # ============================================================
      # 5. LOCATE PROJECT ROOT
      # ============================================================
      - name: Locate A227C project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/a227c-source"

          PROJECT_DIR=""

          # First choice: a directory containing backend/a227c.
          while IFS= read -r backend_dir; do
            candidate="$(dirname "$backend_dir")"

            if [ -d "$candidate/backend/a227c" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$SEARCH_ROOT" -type d -name "backend" -print | sort)

          # Second choice: locate any a227c directory and derive its root.
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r a227c_dir; do
              parent="$(dirname "$a227c_dir")"

              if [ "$(basename "$parent")" = "backend" ]; then
                PROJECT_DIR="$(dirname "$parent")"
                break
              fi
            done < <(find "$SEARCH_ROOT" -type d -name "a227c" -print | sort)
          fi

          # Third choice: source root itself.
          if [ -z "$PROJECT_DIR" ] && [ -d "$SEARCH_ROOT/backend/a227c" ]; then
            PROJECT_DIR="$SEARCH_ROOT"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate A227C project root."
            find "$SEARCH_ROOT" -maxdepth 5 -type d | sort
            exit 1
          fi

          echo "A227C project root:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. VALIDATE BACKEND
      # ============================================================
      - name: Validate A227C backend
        id: backend
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_DIR/backend" ]; then
            echo "ERROR: backend directory not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/backend/a227c" ]; then
            echo "ERROR: backend/a227c directory not found."
            exit 1
          fi

          echo "Backend directory:"
          find "$PROJECT_DIR/backend/a227c" -maxdepth 4 -type f | sort

          echo "backend_available=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ steps.project.outputs.project_dir }}/requirements.txt
            ${{ steps.project.outputs.project_dir }}/pyproject.toml

      # ============================================================
      # 8. INSTALL PYTHON TEST/BUILD DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f "$PROJECT_DIR/requirements.txt" ]; then
            python -m pip install -r "$PROJECT_DIR/requirements.txt"
          fi

          if [ -f "$PROJECT_DIR/pyproject.toml" ]; then
            python -m pip install -e "$PROJECT_DIR" || true
          fi

          python -m pip install pytest pytest-asyncio httpx

      # ============================================================
      # 9. PYTHON PATH
      # ============================================================
      - name: Configure A227C Python path
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "PYTHONPATH=$PROJECT_DIR/backend" >> "$GITHUB_ENV"

      # ============================================================
      # 10. VERIFY IMPORT
      # ============================================================
      - name: Verify A227C import
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -c "import a227c; print('A227C import: OK')"
          python -c "import a227c.core.indicators; print('A227C indicators: OK')"

      # ============================================================
      # 11. COMPILE PYTHON
      # ============================================================
      - name: Compile Python sources
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          python -m compileall -q "$PROJECT_DIR/backend"

          echo "Python compilation: OK"

      # ============================================================
      # 12. RUN TESTS
      # ============================================================
      - name: Run A227C tests
        id: tests
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          TEST_DIR=""

          if [ -d "backend/tests" ]; then
            TEST_DIR="backend/tests"
          elif [ -d "tests" ]; then
            TEST_DIR="tests"
          fi

          if [ -z "$TEST_DIR" ]; then
            echo "ERROR: No A227C test directory found."
            exit 1
          fi

          echo "Test directory: $TEST_DIR"

          python -m pytest "$TEST_DIR" \
            -o asyncio_default_fixture_loop_scope=function \
            -ra

          echo "tests_passed=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 13. CREATE VALIDATION REPORT
      # ============================================================
      - name: Create validation report
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          REPORT_DIR="$GITHUB_WORKSPACE/a227c-artifacts"
          mkdir -p "$REPORT_DIR"

          {
            echo "A227C CI VALIDATION REPORT"
            echo "=========================="
            echo ""
            echo "Project:"
            echo "$PROJECT_DIR"
            echo ""
            echo "Backend:"
            echo "VALIDATED"
            echo ""
            echo "Python:"
            python --version
            echo ""
            echo "Compilation:"
            echo "PASSED"
            echo ""
            echo "Tests:"
            echo "PASSED"
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Workflow:"
            echo "${GITHUB_WORKFLOW}"
            echo ""
            echo "Run:"
            echo "${GITHUB_RUN_ID}"
          } > "$REPORT_DIR/A227C-VALIDATION-REPORT.txt"

          cat "$REPORT_DIR/A227C-VALIDATION-REPORT.txt"

      # ============================================================
      # 14. DETECT REAL ANDROID PROJECT
      # ============================================================
      - name: Detect Android application
        id: android
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ANDROID_DIR=""

          # Search for a real Android app module.
          while IFS= read -r app_dir; do
            if [ -f "$app_dir/build.gradle" ] || \
               [ -f "$app_dir/build.gradle.kts" ]; then

              root="$(dirname "$app_dir")"

              if [ -f "$root/settings.gradle" ] || \
                 [ -f "$root/settings.gradle.kts" ]; then

                if grep -Rqs \
                  "com.android.application\|com.android.library" \
                  "$root"/*.gradle \
                  "$root"/*.gradle.kts \
                  "$root/build.gradle" \
                  "$root/build.gradle.kts" 2>/dev/null; then

                  ANDROID_DIR="$root"
                  break
                fi
              fi
            fi
          done < <(find "$PROJECT_DIR" -type d -name "app" -print | sort)

          if [ -n "$ANDROID_DIR" ]; then
            echo "Real Android project found:"
            echo "$ANDROID_DIR"

            echo "android_available=true" >> "$GITHUB_OUTPUT"
            echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "No verified Android application exists in this source."
            echo "android_available=false" >> "$GITHUB_OUTPUT"
            echo "android_dir=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 15. JAVA 17
      # ============================================================
      - name: Set up Java 17
        if: steps.android.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 16. SET UP GRADLE 8.7
      # ============================================================
      - name: Set up Gradle 8.7
        if: steps.android.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ============================================================
      # 17. BUILD DEBUG APK
      # ============================================================
      - name: Build Android Debug APK
        if: steps.android.outputs.android_available == 'true'
        env:
          ANDROID_DIR: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

          DEBUG_APK="$(find . -type f -path "*/build/outputs/apk/*" \
            -name "*debug*.apk" | head -1 || true)"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Android Debug APK was not produced."
            find . -type f -path "*/build/outputs/*" -print || true
            exit 1
          fi

          echo "Debug APK:"
          echo "$DEBUG_APK"

          mkdir -p "$GITHUB_WORKSPACE/a227c-artifacts/android-debug"
          cp "$DEBUG_APK" \
            "$GITHUB_WORKSPACE/a227c-artifacts/android-debug/A227C-debug.apk"

      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build Android Release APK
        if: steps.android.outputs.android_available == 'true'
        env:
          ANDROID_DIR: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            gradle --no-daemon assembleRelease
          fi

          RELEASE_APK="$(find . -type f -path "*/build/outputs/apk/*" \
            -name "*release*.apk" | head -1 || true)"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Android Release APK was not produced."
            find . -type f -path "*/build/outputs/*" -print || true
            exit 1
          fi

          echo "Release APK:"
          echo "$RELEASE_APK"

          mkdir -p "$GITHUB_WORKSPACE/a227c-artifacts/android-release"
          cp "$RELEASE_APK" \
            "$GITHUB_WORKSPACE/a227c-artifacts/android-release/A227C-release.apk"

      # ============================================================
      # 19. CREATE COMPLETE SOURCE ZIP
      # ============================================================
      - name: Package complete A227C source
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/a227c-artifacts/source"

          cd "$PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/a227c-artifacts/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip" \
            . \
            -x ".git/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".pytest_cache/*"

          test -s \
            "$GITHUB_WORKSPACE/a227c-artifacts/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          echo "Source ZIP created."

      # ============================================================
      # 20. VERIFY ALL ARTIFACTS BEFORE UPLOAD
      # ============================================================
      - name: Verify produced artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$GITHUB_WORKSPACE/a227c-artifacts"

          echo "============================================================"
          echo "PRODUCED A227C ARTIFACTS"
          echo "============================================================"

          find "$ARTIFACT_DIR" -type f -printf '%p (%s bytes)\n' | sort

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"
          REPORT="$ARTIFACT_DIR/A227C-VALIDATION-REPORT.txt"

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Complete source ZIP is missing."
            exit 1
          fi

          if [ ! -s "$REPORT" ]; then
            echo "ERROR: Validation report is missing."
            exit 1
          fi

          if [ "${{ steps.android.outputs.android_available }}" = "true" ]; then

            if [ ! -s "$ARTIFACT_DIR/android-debug/A227C-debug.apk" ]; then
              echo "ERROR: Android project was detected but Debug APK is missing."
              exit 1
            fi

            if [ ! -s "$ARTIFACT_DIR/android-release/A227C-release.apk" ]; then
              echo "ERROR: Android project was detected but Release APK is missing."
              exit 1
            fi

            echo "Android artifacts verified."
          else
            echo "Android artifacts not expected because no Android project exists."
          fi

          echo ""
          echo "Mandatory artifacts verified."

      # ============================================================
      # 21. UPLOAD COMPLETE ARTIFACT SET
      # ============================================================
      - name: Upload A227C artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A227C-BUILD-${{ github.run_number }}
          path: |
            a227c-artifacts/**
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 22. FINAL STATUS
      # ============================================================
      - name: Final A227C status
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "A227C BUILD COMPLETED"
          echo "============================================================"
          echo ""
          echo "Backend validation: PASSED"
          echo "Python compilation: PASSED"
          echo "Tests: PASSED"
          echo "Source ZIP: PRODUCED"
          echo "Artifacts: UPLOADED"

          if [ "${{ steps.android.outputs.android_available }}" = "true" ]; then
            echo "Android application: DETECTED"
            echo "Debug APK: PRODUCED"
            echo "Release APK: PRODUCED"
          else
            echo "Android application: NOT PRESENT IN SOURCE"
            echo "APK build: NOT CLAIMED"
          fi

          echo ""
          echo "This workflow does NOT claim an APK exists unless"
          echo "the APK was physically produced and verified."
