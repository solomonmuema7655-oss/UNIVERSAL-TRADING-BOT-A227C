
name: Build UNIVERSAL-TRADING-BOT-A227C APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build A227C Android APKs
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. INSTALL GRADLE 8.7
      # ============================================================
      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle-8.7-bin.zip

          unzip -q /tmp/gradle-8.7-bin.zip -d /opt

          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

          echo "Gradle 8.7 installed."

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not detected."
            exit 1
          fi

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/platform-tools"

          echo "Android SDK verified: $SDK"

      # ============================================================
      # 6. LOCATE AND EXTRACT A227C SOURCE ZIP
      # ALWAYS BUILD FROM THE SELECTED EXTRACTED ARCHIVE
      # ============================================================
      - name: Extract and select repaired A227C project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_DIR="$WORKSPACE/a227c-extracted"

          echo "Searching for A227C source archive..."

          mapfile -t ZIP_FILES < <(
            find "$WORKSPACE" \
              -type d \( \
                -name .git \
                -o -name .gradle \
                -o -name build \
                -o -name a227c-extracted \
              \) -prune \
              -o \
              -type f \( \
                -name 'UNIVERSAL-TRADING-BOT-A227C-FINAL-BUILD.zip' \
                -o \
                -name 'UNIVERSAL-TRADING-BOT-A227C-READY-TO-UPLOAD.zip' \
                -o \
                -name 'UNIVERSAL-TRADING-BOT-A227C-READY-TO-UPLOAD-RESOURCE-FIX.zip' \
              \) \
              -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No recognized A227C source ZIP found."
            echo "Expected one of the supported A227C archive filenames."

            find "$WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -not -path '*/.git/*' \
              -print

            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple A227C ZIP archives found."
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Keep only ONE authoritative A227C source ZIP."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Selected archive:"
          echo "$ZIP_FILE"

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP_FILE"

          echo "Preparing clean extraction directory..."
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting A227C source..."
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Searching inside extracted archive..."

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do

            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/android/app/build.gradle.kts" ] || \
               [ -f "$DIR/android/app/build.gradle" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find "$EXTRACT_DIR" \
              -type f \( \
                -name settings.gradle.kts \
                -o -name settings.gradle \
              \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."

            find "$EXTRACT_DIR" \
              -maxdepth 8 \
              -type f \
              -print

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "=============================================="
          echo "SELECTED A227C PROJECT"
          echo "$PROJECT_DIR"
          echo "=============================================="

          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. VERIFY ROOT GRADLE SETTINGS
      # ============================================================
      - name: Verify A227C Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          if [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts missing."
            exit 1
          fi

          if [ ! -f build.gradle.kts ] && \
             [ ! -f build.gradle ]; then
            echo "ERROR: Root build.gradle file missing."
            exit 1
          fi

          if [ ! -f android/app/build.gradle.kts ] && \
             [ ! -f android/app/build.gradle ]; then
            echo "ERROR: Android app Gradle file missing."
            exit 1
          fi

          if ! grep -Fq \
            'rootProject.name = "UNIVERSAL-TRADING-BOT-A227C"' \
            settings.gradle.kts; then

            echo "ERROR: Incorrect Kotlin project name."
            cat settings.gradle.kts
            exit 1
          fi

          if ! grep -Fq \
            'include(":android:app")' \
            settings.gradle.kts; then

            echo "ERROR: Android module include declaration missing."
            cat settings.gradle.kts
            exit 1
          fi

          echo "Root Gradle settings verified."
          cat settings.gradle.kts

          echo "Android module verified."
          ls -la android/app

      # ============================================================
      # 8. VERIFY ANDROIDX CONFIGURATION
      # ============================================================
      - name: Verify AndroidX configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          if [ ! -f gradle.properties ]; then
            echo "ERROR: Root gradle.properties missing."
            exit 1
          fi

          if ! grep -Eq \
            '^[[:space:]]*android\.useAndroidX[[:space:]]*=[[:space:]]*true[[:space:]]*$' \
            gradle.properties; then

            echo "ERROR: android.useAndroidX=true is missing."
            cat gradle.properties
            exit 1
          fi

          echo "AndroidX configuration verified."
          cat gradle.properties

      # ============================================================
      # 9. VERIFY ANDROID MANIFEST AND SOURCE
      # ============================================================
      - name: Verify Android source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          test -f android/app/src/main/AndroidManifest.xml

          SOURCE_COUNT="$(
            find android/app/src/main \
              -type f \
              \( -name '*.kt' -o -name '*.java' \) \
              | wc -l
          )"

          if [ "$SOURCE_COUNT" -eq 0 ]; then
            echo "ERROR: Android source files missing."
            exit 1
          fi

          echo "Android manifest verified."
          echo "Android source files found: $SOURCE_COUNT"

          find android/app/src/main \
            -type f \
            \( -name '*.kt' -o -name '*.java' \) \
            -print

      # ============================================================
      # 10. VERIFY OFFICIAL A227C LOGO
      # ============================================================
      - name: Verify official A227C logo
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          LOGO="android/app/src/main/res/drawable-nodpi/a227c_logo.png"

          if [ ! -s "$LOGO" ]; then
            echo "ERROR: Official A227C logo missing."

            find android/app/src/main/res \
              -type f \
              -print

            exit 1
          fi

          echo "Official A227C logo verified."
          ls -lh "$LOGO"

      # ============================================================
      # 11. VERIFY GRADLE 8.7
      # ============================================================
      - name: Verify Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      # ============================================================
      # 12. CLEAN PROJECT
      # ============================================================
      - name: Clean A227C Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            :android:app:clean \
            --stacktrace

      # ============================================================
      # 13. BUILD DEBUG APK
      # ============================================================
      - name: Build A227C Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            :android:app:assembleDebug \
            --stacktrace

      # ============================================================
      # 14. VERIFY DEBUG APK
      # ============================================================
      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$BUILD_DIR/android/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Debug APK output directory missing."
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" -type f -name '*.apk' -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: Debug APK not generated."
            exit 1
          fi

          echo "A227C DEBUG APK GENERATED"
          printf '%s\n' "${APKS[@]}"
          ls -lh "${APKS[@]}"

      # ============================================================
      # 15. UPLOAD DEBUG APK
      # ============================================================
      - name: Upload A227C Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Debug-APK
          path: ${{ env.BUILD_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16. BUILD RELEASE APK
      # ============================================================
      - name: Build A227C Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            :android:app:assembleRelease \
            --stacktrace

      # ============================================================
      # 17. VERIFY RELEASE APK
      # ============================================================
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$BUILD_DIR/android/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK output directory missing."
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" -type f -name '*.apk' -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          echo "A227C RELEASE APK GENERATED"
          printf '%s\n' "${APKS[@]}"
          ls -lh "${APKS[@]}"

      # ============================================================
      # 18. UPLOAD RELEASE APK
      # ============================================================
      - name: Upload A227C Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Release-APK
          path: ${{ env.BUILD_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================
      - name: A227C Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "       UNIVERSAL-TRADING-BOT-A227C"
          echo "======================================================"
          echo ""
          echo "ANDROID BUILD COMPLETED SUCCESSFULLY"
          echo ""
          echo "Debug APK:   GENERATED AND UPLOADED"
          echo "Release APK: GENERATED AND UPLOADED"
          echo ""
          echo "Official A227C branding: VERIFIED"
          echo "Gradle root: VERIFIED"
          echo "AndroidX: VERIFIED"
          echo "======================================================"
          
