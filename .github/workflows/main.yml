
name: UNIVERSAL-TRADING-BOT-A227C - Final Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - '*.zip'

permissions:
  contents: read

concurrency:
  group: a227c-final-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.7"
  ANDROID_API_LEVEL: "35"
  SOURCE_ARCHIVE: "UNIVERSAL-TRADING-BOT-A227C-FINAL-PRODUCTION-SOURCE-RESEARCH-COMPLETE.zip"

jobs:
  build:
    name: Validate and Build A227C
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository source archive..."

          if [[ ! -f "$SOURCE_ARCHIVE" ]]; then
            echo "::error::Required source archive not found: $SOURCE_ARCHIVE"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Source archive found."
          ls -lh "$SOURCE_ARCHIVE"

          mkdir -p "$GITHUB_WORKSPACE/a227c-extracted"

          unzip -q "$SOURCE_ARCHIVE" \
            -d "$GITHUB_WORKSPACE/a227c-extracted"

          echo "Archive extracted successfully."

      - name: Locate A227C project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/a227c-extracted"

          INDICATORS="$(find "$SEARCH_ROOT" \
            -type f \
            -path '*/backend/a227c/core/indicators.py' \
            -print -quit)"

          if [[ -z "$INDICATORS" ]]; then
            echo "::error::Could not locate backend/a227c/core/indicators.py"
            find "$SEARCH_ROOT" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$INDICATORS")")")")"

          if [[ ! -d "$PROJECT_ROOT/backend/a227c" ]]; then
            echo "::error::Invalid A227C project root."
            exit 1
          fi

          echo "A227C project root: $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install \
            pytest \
            numpy \
            pandas \
            fastapi \
            uvicorn \
            pydantic

      - name: Validate required A227C source files
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "backend/a227c/core/indicators.py"
            "backend/a227c/core/research_candidates.py"
            "backend/a227c/providers/symbol_discovery.py"
            "backend/a227c/research/statistics.py"
            "backend/a227c/research/tick_replay.py"
            "backend/a227c/research/duration_calibration.py"
            "backend/a227c/research/swap_ledger.py"
            "backend/a227c/research/strategy_candidates.py"
            "backend/a227c/research/shadow.py"
            "backend/a227c/research/acceptance.py"
            "backend/a227c/research/validate_all.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required source file missing: $FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          if [[ ! -d backend/tests ]]; then
            echo "::error::Backend test directory is missing."
            exit 1
          fi

      - name: Validate Python imports
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib

          modules = [
              "a227c.core.indicators",
              "a227c.core.research_candidates",
              "a227c.providers.symbol_discovery",
              "a227c.research.statistics",
              "a227c.research.tick_replay",
              "a227c.research.duration_calibration",
              "a227c.research.swap_ledger",
              "a227c.research.strategy_candidates",
              "a227c.research.shadow",
              "a227c.research.acceptance",
              "a227c.research.validate_all",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"IMPORT OK: {name}")

          print("A227C module import validation passed.")
          PY

      - name: Compile Python source
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q backend/a227c

          echo "Python compilation passed."

      - name: Run complete backend test suite
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        run: |
          set -euo pipefail

          python -m pytest backend/tests \
            -v \
            --tb=short \
            --junitxml=a227c-backend-test-results.xml

      - name: Validate five-market architecture
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        env:
          PYTHONPATH: ${{ steps.project.outputs.root }}/backend
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import importlib

          root = Path("backend/a227c")

          required_markets = [
              "XAUUSD",
              "USTECH100",
              "GBPJPY",
              "GBPUSD",
              "USDJPY",
          ]

          candidates_module = importlib.import_module(
              "a227c.core.research_candidates"
          )

          source_files = [
              root / "core" / "research_candidates.py",
              root / "research" / "strategy_candidates.py",
          ]

          combined = "\n".join(
              path.read_text(encoding="utf-8")
              for path in source_files
          )

          for market in required_markets:
              if market not in combined:
                  raise SystemExit(
                      f"Five-market architecture check failed: {market}"
                  )
              print(f"MARKET SOURCE PRESENT: {market}")

          print(
              "Research candidate module loaded:",
              candidates_module.__name__
          )

          print("Five-market source coverage check passed.")
          PY

      - name: Check for broker trade execution calls
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          runtime = Path("backend/a227c")

          forbidden = {
              "order_send",
              "order_modify",
              "order_delete",
          }

          violations = []

          for path in runtime.rglob("*.py"):
              try:
                  source = path.read_text(encoding="utf-8")
                  tree = ast.parse(source, filename=str(path))
              except (UnicodeDecodeError, SyntaxError):
                  continue

              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue

                  function = node.func

                  if isinstance(function, ast.Attribute):
                      if function.attr in forbidden:
                          violations.append(
                              f"{path}:{node.lineno}: {function.attr}"
                          )

          if violations:
              print("\n".join(violations))
              raise SystemExit(
                  "Forbidden broker execution calls detected."
              )

          print(
              "No forbidden broker order execution calls "
              "detected in the A227C runtime package."
          )
          PY

      - name: Validate production configuration template
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="backend/config.production.example.json"

          if [[ -f "$CONFIG" ]]; then
            python -m json.tool "$CONFIG" > /dev/null
            echo "Production configuration JSON is valid."
          else
            echo "::warning::Production configuration example not found."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate Android Gradle project
        id: android
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_WRAPPER="$(find . \
            -type f \
            -name gradlew \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [[ -z "$GRADLE_WRAPPER" ]]; then
            echo "::error::Gradle wrapper gradlew was not found."
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$GRADLE_WRAPPER")"

          if [[ ! -f "$GRADLE_ROOT/settings.gradle" && \
                ! -f "$GRADLE_ROOT/settings.gradle.kts" ]]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if ! find "$GRADLE_ROOT" \
            -type f \
            -name AndroidManifest.xml \
            -print -quit | grep -q .; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

          chmod +x "$GRADLE_WRAPPER"

          echo "Gradle project root: $GRADLE_ROOT"
          echo "root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: Verify Gradle version
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: Build Debug and Release APKs
        id: build
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            assembleRelease

          echo "Android Debug and Release build tasks completed."

      - name: Locate and validate APK outputs
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_ROOT="${{ steps.android.outputs.root }}"

          DEBUG_APK="$(find "$GRADLE_ROOT" \
            -type f \
            -path '*/build/outputs/apk/*/debug/*.apk' \
            -print -quit)"

          RELEASE_APK="$(find "$GRADLE_ROOT" \
            -type f \
            -path '*/build/outputs/apk/*/release/*.apk' \
            -print -quit)"

          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p artifacts

          cp "$DEBUG_APK" artifacts/A227C-DEBUG.apk
          cp "$RELEASE_APK" artifacts/A227C-RELEASE.apk

          echo "debug=artifacts/A227C-DEBUG.apk" >> "$GITHUB_OUTPUT"
          echo "release=artifacts/A227C-RELEASE.apk" >> "$GITHUB_OUTPUT"

          echo "APK outputs validated:"
          ls -lh artifacts/*.apk

      - name: Generate APK checksums
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts

          sha256sum \
            A227C-DEBUG.apk \
            A227C-RELEASE.apk \
            > APK-SHA256SUMS.txt

          cat APK-SHA256SUMS.txt

      - name: Package validated A227C source
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          zip -qr \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            . \
            -x "*/__pycache__/*" \
               "*/.pytest_cache/*" \
               "*/.gradle/*" \
               "*/build/*" \
               "*/.git/*" \
               "artifacts/*" \
               "*.pyc" \
               "*.pyo"

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.sha256

          ls -lh artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE*

      - name: Generate final build report
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="artifacts/A227C-FINAL-BUILD-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "FINAL BUILD REPORT"
            echo "=========================================="
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "BUILD ENVIRONMENT"
            echo "Runner: ubuntu-22.04"
            echo "Java: 17"
            echo "Gradle: 8.7"
            echo "Python: $PYTHON_VERSION"
            echo "Android API: $ANDROID_API_LEVEL"
            echo
            echo "VALIDATION"
            echo "Backend test step: PASSED"
            echo "Python compilation: PASSED"
            echo "Module imports: PASSED"
            echo "Five-market source coverage: PASSED"
            echo "Broker execution-call scan: PASSED"
            echo "Android Debug build: PASSED"
            echo "Android Release build: PASSED"
            echo
            echo "OUTPUTS"
            echo "A227C-DEBUG.apk"
            echo "A227C-RELEASE.apk"
            echo "Validated source ZIP"
            echo "SHA-256 checksum files"
            echo
            echo "IMPORTANT LIMITATIONS"
            echo "A successful CI build does not prove live MT5 connectivity."
            echo "It does not prove Exness account/provider authentication."
            echo "It does not prove live WSS deployment or TLS acceptance."
            echo "It does not prove physical Android device acceptance."
            echo "It does not establish empirical profitability or strategy validation."
            echo "It does not establish Google Play Protect approval."
            echo
            echo "END OF REPORT"
          } > "$REPORT"

          cat "$REPORT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Debug-APK
          path: ${{ steps.project.outputs.root }}/artifacts/A227C-DEBUG.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Release-APK
          path: ${{ steps.project.outputs.root }}/artifacts/A227C-RELEASE.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated source and reports
        uses: actions/upload-artifact@v4
        with:
          name: A227C-Validated-Source-and-Reports
          path: |
            ${{ steps.project.outputs.root }}/artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip
            ${{ steps.project.outputs.root }}/artifacts/UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.sha256
            ${{ steps.project.outputs.root }}/artifacts/APK-SHA256SUMS.txt
            ${{ steps.project.outputs.root }}/artifacts/A227C-FINAL-BUILD-REPORT.txt
            ${{ steps.project.outputs.root }}/a227c-backend-test-results.xml
          if-no-files-found: error
          retention-days: 30
          
