
name: A227C Complete Build and Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: a227c-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: A227C Source, Validation and Android Build
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ARTIFACT_DIR: ${{ github.workspace }}/a227c-artifacts
      SOURCE_DIR: ${{ github.workspace }}/a227c-source

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. INITIALIZE DIRECTORIES
      # --------------------------------------------------

      - name: Initialize build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$SOURCE_DIR"
          mkdir -p "$ARTIFACT_DIR/source"
          mkdir -p "$ARTIFACT_DIR/reports"
          mkdir -p "$ARTIFACT_DIR/android"

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Artifact directory: $ARTIFACT_DIR"
          echo "Source directory: $SOURCE_DIR"

      # --------------------------------------------------
      # 3. LOCATE AND EXTRACT A227C SOURCE
      # --------------------------------------------------

      - name: Locate and extract A227C source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SOURCE_DIR="$GITHUB_WORKSPACE/a227c-source"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/a227c-artifacts"

          echo "Searching for A227C source..."

          PROJECT_DIR=""

          # Search for an already-extracted project.
          while IFS= read -r -d '' file; do
            PROJECT_DIR="${file%/backend/a227c/core/indicators.py}"
            break
          done < <(
            find "$ROOT" \
              -path "$ROOT/.git" -prune -o \
              -path "$SOURCE_DIR" -prune -o \
              -path "$ARTIFACT_DIR" -prune -o \
              -type f \
              -path '*/backend/a227c/core/indicators.py' \
              -print0
          )

          # If not found, search ZIP archives by their contents.
          if [ -z "$PROJECT_DIR" ]; then

            MATCHES=()

            while IFS= read -r -d '' archive; do

              if ! unzip -tq "$archive" >/dev/null 2>&1; then
                continue
              fi

              ENTRIES="$(unzip -Z1 "$archive" 2>/dev/null || true)"

              if printf '%s\n' "$ENTRIES" |
                grep -Eq '(^|/)backend/a227c/core/indicators\.py$'; then
                MATCHES+=("$archive")
              fi

            done < <(
              find "$ROOT" \
                -path "$ROOT/.git" -prune -o \
                -path "$SOURCE_DIR" -prune -o \
                -path "$ARTIFACT_DIR" -prune -o \
                -type f -iname '*.zip' -print0
            )

            if [ "${#MATCHES[@]}" -eq 0 ]; then
              echo "ERROR: No A227C source ZIP was found."
              echo "Required archive content:"
              echo "backend/a227c/core/indicators.py"
              exit 1
            fi

            if [ "${#MATCHES[@]}" -gt 1 ]; then
              echo "ERROR: Multiple A227C source archives found."
              printf '%s\n' "${MATCHES[@]}"
              echo "Keep only the intended source archive in the repository."
              exit 1
            fi

            ARCHIVE="${MATCHES[0]}"

            echo "Recognized source archive:"
            echo "$ARCHIVE"

            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"

            unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

            echo "Source archive extracted."

            # IMPORTANT:
            # Derive the project root from the actual module path.
            # Do not use a fixed number of dirname operations.

            while IFS= read -r -d '' file; do
              PROJECT_DIR="${file%/backend/a227c/core/indicators.py}"
              break
            done < <(
              find "$SOURCE_DIR" \
                -type f \
                -path '*/backend/a227c/core/indicators.py' \
                -print0
            )
          fi

          # Validate the derived project root.
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: A227C project root could not be located."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/backend/a227c/core/indicators.py" ]; then
            echo "ERROR: Required indicators module is missing."
            echo "Detected directory: $PROJECT_DIR"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/backend/a227c" ]; then
            echo "ERROR: A227C Python package directory is missing."
            exit 1
          fi

          echo "========================================"
          echo "A227C PROJECT ROOT VERIFIED"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PYTHONPATH=$PROJECT_DIR/backend"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PROJECT_DIR/backend" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "A227C source discovery completed."

      # --------------------------------------------------
      # 4. PACKAGE SOURCE BEFORE VALIDATION
      # --------------------------------------------------

      - name: Package A227C source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          OUTPUT="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          echo "Packaging A227C project..."
          echo "Project directory: $PROJECT_DIR"

          mkdir -p "$(dirname "$OUTPUT")"
          rm -f "$OUTPUT"

          zip -qr "$OUTPUT" . \
            -x "./.git/*" \
            -x "./.venv/*" \
            -x "./venv/*" \
            -x "./__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "./.pytest_cache/*" \
            -x "./a227c-artifacts/*" \
            -x "./a227c-source/*"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Source ZIP was not created."
            exit 1
          fi

          echo "Verifying source ZIP..."
          unzip -tq "$OUTPUT"

          echo "Source ZIP successfully created:"
          ls -lh "$OUTPUT"

          echo "package_ready=true" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 5. SET UP PYTHON
      # --------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # --------------------------------------------------
      # 6. INSTALL BACKEND DEPENDENCIES
      # --------------------------------------------------

      - name: Install A227C Python dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Upgrading Python packaging tools..."

          python -m pip install --upgrade pip setuptools wheel

          # Install NumPy before importing A227C indicators.
          echo "Installing NumPy..."

          python -m pip install numpy

          # Install declared requirements when available.
          REQUIREMENTS_FILES=(
            "$PROJECT_DIR/backend/requirements.txt"
            "$PROJECT_DIR/requirements.txt"
            "$PROJECT_DIR/backend/requirements-dev.txt"
            "$PROJECT_DIR/requirements-dev.txt"
          )

          for REQUIREMENTS in "${REQUIREMENTS_FILES[@]}"; do
            if [ -f "$REQUIREMENTS" ]; then
              echo "Installing: $REQUIREMENTS"
              python -m pip install -r "$REQUIREMENTS"
            fi
          done

          # Install the project if it declares a package.
          if [ -f "$PROJECT_DIR/backend/pyproject.toml" ]; then
            echo "Installing backend package..."
            python -m pip install -e "$PROJECT_DIR/backend"

          elif [ -f "$PROJECT_DIR/pyproject.toml" ]; then
            echo "Installing project package..."
            python -m pip install -e "$PROJECT_DIR"
          fi

          # Install test dependencies.
          python -m pip install pytest pytest-asyncio httpx

          echo "Verifying NumPy..."
          python -c "import numpy; print('NumPy:', numpy.__version__)"

          echo "Checking dependency consistency..."
          python -m pip check

          echo "Python dependency installation completed."

      # --------------------------------------------------
      # 7. VERIFY A227C IMPORTS
      # --------------------------------------------------

      - name: Verify A227C imports
        id: imports
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking A227C package..."
          python -c "import a227c"

          echo "Checking indicators..."
          python -c "import a227c.core.indicators"

          echo "Checking NumPy integration..."
          python -c "import numpy as np; print(np.array([1, 2, 3]))"

          echo "A227C imports verified successfully."

      # --------------------------------------------------
      # 8. COMPILE PYTHON SOURCE
      # --------------------------------------------------

      - name: Compile A227C Python source
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m compileall -q backend/a227c

          echo "A227C Python compilation completed."

      # --------------------------------------------------
      # 9. RUN AUTOMATED TESTS
      # --------------------------------------------------

      - name: Run A227C automated tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -d tests ]; then
            echo "Running root tests..."
            python -m pytest -v tests

          elif [ -d backend/tests ]; then
            echo "Running backend tests..."
            python -m pytest -v backend/tests

          else
            echo "Searching for Python test files..."

            mapfile -t TEST_FILES < <(
              find . \
                -path './.git' -prune -o \
                -path './.venv' -prune -o \
                -path './venv' -prune -o \
                -path '*/__pycache__' -prune -o \
                -type f \
                \( -name 'test_*.py' -o -name '*_test.py' \) \
                -print
            )

            if [ "${#TEST_FILES[@]}" -gt 0 ]; then
              python -m pytest -v
            else
              echo "WARNING: No Python test files were found."
              echo "No automated test suite was executed."
            fi
          fi

          echo "Automated test step completed."

      # --------------------------------------------------
      # 10. DETECT ANDROID APPLICATION
      # --------------------------------------------------

      - name: Detect Android application
        id: android
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android Gradle application..."

          APP_GRADLE=""

          while IFS= read -r -d '' candidate; do

            if grep -Eq 'com\.android\.application' "$candidate"; then
              APP_GRADLE="$candidate"
              break
            fi

          done < <(
            find "$PROJECT_DIR" \
              -path '*/.gradle' -prune -o \
              -path '*/build' -prune -o \
              -type f \
              \( -path '*/app/build.gradle' -o \
                 -path '*/app/build.gradle.kts' \) \
              -print0
          )

          if [ -z "$APP_GRADLE" ]; then
            echo "No Android application module detected."
            echo "This source package may contain backend components only."
            echo "android_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ANDROID_ROOT="$(dirname "$(dirname "$APP_GRADLE")")"

          if [ ! -f "$ANDROID_ROOT/settings.gradle" ] &&
             [ ! -f "$ANDROID_ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Android settings file is missing."
            exit 1
          fi

          echo "Android module: $APP_GRADLE"
          echo "Android project root: $ANDROID_ROOT"

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "android_available=true" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 11. SET UP JAVA 17
      # --------------------------------------------------

      - name: Set up Java 17
        if: steps.android.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 12. SET UP ANDROID SDK
      # --------------------------------------------------

      - name: Set up Android SDK
        if: steps.android.outputs.android_available == 'true'
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 13. SET UP GRADLE 8.7
      # --------------------------------------------------

      - name: Set up Gradle 8.7
        if: steps.android.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # --------------------------------------------------
      # 14. BUILD DEBUG AND RELEASE APK
      # --------------------------------------------------

      - name: Build Android Debug and Release APK
        id: android_build
        if: steps.android.outputs.android_available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_ROOT"

          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Building Android application..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug \
            assembleRelease

          echo "Searching for APK outputs..."

          mapfile -t APK_FILES < <(
            find "$ANDROID_ROOT" \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          DEBUG_FOUND=false
          RELEASE_FOUND=false

          for APK in "${APK_FILES[@]}"; do
            echo "Generated APK: $APK"

            case "$APK" in
              *debug*.apk)
                cp "$APK" "$ARTIFACT_DIR/android/A227C-debug.apk"
                DEBUG_FOUND=true
                ;;
              *release*.apk)
                cp "$APK" "$ARTIFACT_DIR/android/A227C-release.apk"
                RELEASE_FOUND=true
                ;;
            esac
          done

          if [ "$DEBUG_FOUND" != true ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ "$RELEASE_FOUND" != true ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Debug and Release APKs generated."

      # --------------------------------------------------
      # 15. GENERATE BUILD REPORT
      # --------------------------------------------------

      - name: Generate A227C build report
        if: always()
        shell: bash
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          IMPORT_RESULT: ${{ steps.imports.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          ANDROID_RESULT: ${{ steps.android_build.outcome }}
          ANDROID_AVAILABLE: ${{ steps.android.outputs.android_available }}
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR/reports"

          REPORT="$ARTIFACT_DIR/reports/A227C-BUILD-REPORT.txt"

          {
            echo "UNIVERSAL-TRADING-BOT-A227C"
            echo "BUILD AND VALIDATION REPORT"
            echo "========================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Source discovery: ${SOURCE_RESULT:-not completed}"
            echo "Source packaging: ${PACKAGE_RESULT:-not completed}"
            echo "Dependencies: ${DEPENDENCY_RESULT:-not completed}"
            echo "Imports: ${IMPORT_RESULT:-not completed}"
            echo "Compilation: ${COMPILE_RESULT:-not completed}"
            echo "Automated tests: ${TEST_RESULT:-not completed}"
            echo "Android detected: ${ANDROID_AVAILABLE:-unknown}"
            echo "Android build: ${ANDROID_RESULT:-not executed}"
            echo
            echo "IMPORTANT:"
            echo "A successful source package does not establish"
            echo "that external market-data providers are connected."
            echo "It does not establish live market access,"
            echo "deployment, or physical-device acceptance."
            echo
            echo "A227C is a signal-analysis application."
            echo "It does not execute broker trades."
          } > "$REPORT"

          cat "$REPORT"

      # --------------------------------------------------
      # 16. VERIFY ARTIFACTS
      # --------------------------------------------------

      - name: Verify generated artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "Available A227C artifacts:"

          find "$ARTIFACT_DIR" \
            -maxdepth 5 \
            -type f \
            -printf '%p (%s bytes)\n'

          SOURCE_ZIP="$ARTIFACT_DIR/source/UNIVERSAL-TRADING-BOT-A227C-COMPLETE-SOURCE.zip"

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP is missing or empty."
            exit 1
          fi

          echo "Checking source ZIP integrity..."
          unzip -tq "$SOURCE_ZIP"

          echo "Source artifact verified."

      # --------------------------------------------------
      # 17. UPLOAD ARTIFACTS
      # --------------------------------------------------

      - name: Upload A227C build artifacts
        if: always() && steps.package.outputs.package_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-BUILD
          path: a227c-artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      # --------------------------------------------------
      # 18. FINAL STATUS
      # --------------------------------------------------

      - name: Final build status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "========================================"
          echo "UNIVERSAL-TRADING-BOT-A227C"
          echo "BUILD PROCESS FINISHED"
          echo "========================================"
          echo "Job status: $JOB_STATUS"
          echo "Artifacts: $ARTIFACT_DIR"
          
