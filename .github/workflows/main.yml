name: Build UNIVERSAL-TRADING-BOT-A227C

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Validate A227C and Build Android APKs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "A227C repository contents"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            -not -path '*/.git/*' \
            -print | sort

      - name: Locate A227C source archive
        id: locate_source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Searching for A227C source archive..."
          echo "=========================================="

          ZIP_FILE=""

          while IFS= read -r candidate; do
            echo ""
            echo "Checking candidate:"
            echo "$candidate"

            if ! unzip -t "$candidate" >/dev/null 2>&1; then
              echo "  -> Invalid ZIP archive."
              continue
            fi

            echo "  -> ZIP integrity: OK"

            if unzip -l "$candidate" 2>/dev/null | \
              grep -qE '(^|/)(backend/a227c/|a227c/research/|a227c_r[0-9]+/backend/a227c/)'; then

              echo "  -> A227C source structure detected."
              ZIP_FILE="$candidate"
              break
            fi

            echo "  -> A227C source structure not detected."

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              ! -name 'gradle-*.zip' \
              ! -path '*/.git/*' \
              -print | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: No valid A227C source ZIP was found."
            echo ""
            echo "ZIP files discovered:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              ! -path '*/.git/*' \
              -print | sort || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "A227C source archive selected:"
          echo "$ZIP_FILE"
          echo "=========================================="

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract A227C source
        id: extract_source
        shell: bash
        env:
          ZIP_FILE: ${{ steps.locate_source.outputs.zip_file }}
        run: |
          set -euo pipefail

          SOURCE_ROOT="$GITHUB_WORKSPACE/a227c-source"

          echo "=========================================="
          echo "Extracting A227C source"
          echo "=========================================="

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          unzip -q -o "$ZIP_FILE" -d "$SOURCE_ROOT"

          echo ""
          echo "Extracted directories:"
          find "$SOURCE_ROOT" \
            -type d \
            -not -path '*/.git/*' \
            -print | sort

          echo ""
          echo "A227C source extraction completed."

      - name: Locate A227C project root
        id: project_root
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="$GITHUB_WORKSPACE/a227c-source"

          echo "=========================================="
          echo "Searching for A227C project root..."
          echo "=========================================="

          echo ""
          echo "Searching for backend/a227c directory..."

          PROJECT_DIR=""

          while IFS= read -r a227c_dir; do

            echo "Found candidate A227C package:"
            echo "$a227c_dir"

            BACKEND_DIR="$(dirname "$a227c_dir")"

            if [ "$(basename "$BACKEND_DIR")" = "backend" ]; then

              CANDIDATE_ROOT="$(dirname "$BACKEND_DIR")"

              echo "Candidate project root:"
              echo "$CANDIDATE_ROOT"

              if [ -d "$CANDIDATE_ROOT/backend" ] && \
                 [ -d "$CANDIDATE_ROOT/backend/a227c" ]; then

                PROJECT_DIR="$CANDIDATE_ROOT"
                break

              fi
            fi

          done < <(
            find "$SOURCE_ROOT" \
              -type d \
              -name "a227c" \
              -print | sort
          )

          # Fallback:
          # Some archives may contain the project under a wrapper directory.
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "Primary project-root search did not match."
            echo "Running fallback structural search..."

            while IFS= read -r backend_dir; do

              if [ -d "$backend_dir/a227c" ]; then

                CANDIDATE_ROOT="$(dirname "$backend_dir")"

                echo "Fallback candidate:"
                echo "$CANDIDATE_ROOT"

                PROJECT_DIR="$CANDIDATE_ROOT"
                break

              fi

            done < <(
              find "$SOURCE_ROOT" \
                -type d \
                -name "backend" \
                -print | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Could not locate A227C project root."
            echo ""
            echo "Full extracted directory tree:"
            find "$SOURCE_ROOT" \
              -type d \
              -not -path '*/.git/*' \
              -print | sort

            echo ""
            echo "Possible A227C directories:"
            find "$SOURCE_ROOT" \
              -type d \
              -name "a227c" \
              -print | sort || true

            echo ""
            echo "Possible backend directories:"
            find "$SOURCE_ROOT" \
              -type d \
              -name "backend" \
              -print | sort || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "A227C PROJECT ROOT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate A227C backend source
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Validating A227C backend"
          echo "=========================================="

          test -d backend
          test -d backend/a227c

          echo "Backend directory: OK"
          echo "A227C package: OK"

          echo ""
          echo "A227C backend files:"

          find backend/a227c \
            -type f \
            -print | sort

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python -m pip install --upgrade pip

          if [ -f backend/requirements.txt ]; then

            echo "Installing backend/requirements.txt..."
            python -m pip install -r backend/requirements.txt

          elif [ -f requirements.txt ]; then

            echo "Installing requirements.txt..."
            python -m pip install -r requirements.txt

          elif [ -f backend/pyproject.toml ]; then

            echo "Installing backend package..."
            python -m pip install -e backend

          elif [ -f pyproject.toml ]; then

            echo "Installing project package..."
            python -m pip install -e .

          else

            echo "No dependency manifest found."
            echo "Installing CI test dependencies..."

            python -m pip install pytest

          fi

      - name: Run Python compile check
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Running Python compile check"
          echo "=========================================="

          python -m compileall -q backend

          echo "Python compile check passed."

      - name: Run A227C test suite
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Running A227C tests"
          echo "=========================================="

          if [ -d backend/tests ]; then

            pytest -q backend/tests

          elif [ -d tests ]; then

            pytest -q tests

          else

            echo "WARNING: No test directory found."
            echo "Compile validation has already passed."

          fi

      - name: Locate Android project
        id: android_project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Searching for Android Gradle project"
          echo "=========================================="

          ANDROID_DIR=""

          SETTINGS_FILE="$(
            find . \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              ! -path './.git/*' \
              -print | sort | head -1
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$ANDROID_DIR" ]; then

            echo "No Android Gradle project found."
            echo "Android build will be skipped."

            echo "android_available=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then

            echo "ERROR: Android settings file found,"
            echo "but app Gradle module is missing."

            exit 1
          fi

          echo "android_available=true" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.android_project.outputs.android_available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        if: steps.android_project.outputs.android_available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android Debug APK
        if: steps.android_project.outputs.android_available == 'true'
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.android_project.outputs.android_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/$ANDROID_DIR"

          if [ -f gradlew ]; then

            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace

          else

            gradle assembleDebug --stacktrace

          fi

      - name: Build Android Release APK
        if: steps.android_project.outputs.android_available == 'true'
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.android_project.outputs.android_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/$ANDROID_DIR"

          if [ -f gradlew ]; then

            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace

          else

            gradle assembleRelease --stacktrace

          fi

      - name: Upload A227C Android artifacts
        if: steps.android_project.outputs.android_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Android-APKs
          if-no-files-found: error
          path: |
            ${{ steps.project_root.outputs.project_dir }}/${{ steps.android_project.outputs.android_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project_root.outputs.project_dir }}/${{ steps.android_project.outputs.android_dir }}/app/build/outputs/apk/release/*.apk

      - name: Final A227C build summary
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project_root.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "A227C CI SUMMARY"
          echo "=========================================="

          echo "Source archive: detected"
          echo "Source extraction: successful"
          echo "A227C project root: $PROJECT_DIR"
          echo "Backend source: detected"
          echo "Python compilation: successful"
          echo "Backend tests: completed"

          if [ "${{ steps.android_project.outputs.android_available }}" = "true" ]; then
            echo "Android project: detected"
            echo "Android APK build: completed"
          else
            echo "Android project: not present in this archive"
            echo "Android APK build: skipped"
          fi

          echo "=========================================="
          echo "A227C CI PROCESS COMPLETED"
          echo "=========================================="
