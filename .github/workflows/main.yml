name: A227C Complete Build and Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: a227c-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate A227C and Build Android APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      PYTHON_VERSION: "3.11"
      JAVA_VERSION: "17"
      GRADLE_VERSION: "8.7"
      ANDROID_API: "35"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout A227C source
        uses: actions/checkout@v4

      # ============================================================
      # DISCOVER PROJECT
      # ============================================================

      - name: Discover A227C project structure
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE"

          if [[ ! -f "$PROJECT_ROOT/backend/a227c/core/indicators.py" ]]; then
            echo "::error::A227C backend indicators module not found."
            exit 1
          fi

          if [[ -f "$PROJECT_ROOT/settings.gradle.kts" ]]; then
            SETTINGS_FILE="$PROJECT_ROOT/settings.gradle.kts"
          elif [[ -f "$PROJECT_ROOT/settings.gradle" ]]; then
            SETTINGS_FILE="$PROJECT_ROOT/settings.gradle"
          else
            SETTINGS_FILE="$(find "$PROJECT_ROOT" -maxdepth 5 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"
          fi

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$SETTINGS_FILE")"

          APP_BUILD_FILE="$(find "$GRADLE_ROOT" -type f \
            \( -path '*/android/app/build.gradle' \
            -o -path '*/android/app/build.gradle.kts' \
            -o -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            -print -quit)"

          if [[ -z "$APP_BUILD_FILE" ]]; then
            echo "::error::Android application module not found."
            exit 1
          fi

          APP_DIR="$(dirname "$APP_BUILD_FILE")"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          LOGO="$(find "$APP_DIR/src/main/res" -type f \
            \( -iname 'a227c_logo.png' \
            -o -iname 'siyoma_logo.png' \
            -o -iname '*a227c*logo*.png' \
            -o -iname '*siyoma*logo*.png' \) \
            -print -quit)"

          if [[ -z "$LOGO" ]]; then
            echo "::error::A227C/SIYOMA logo not found."
            exit 1
          fi

          RELATIVE_APP="${APP_DIR#"$GRADLE_ROOT"/}"
          MODULE_TASK=":${RELATIVE_APP//\//:}"

          {
            echo "project_root=$PROJECT_ROOT"
            echo "gradle_root=$GRADLE_ROOT"
            echo "app_dir=$APP_DIR"
            echo "module_task=$MODULE_TASK"
            echo "manifest=$MANIFEST"
            echo "logo=$LOGO"
          } >> "$GITHUB_OUTPUT"

          echo "Project root: $PROJECT_ROOT"
          echo "Gradle root: $GRADLE_ROOT"
          echo "Application module: $MODULE_TASK"
          echo "Manifest: $MANIFEST"
          echo "Logo: $LOGO"

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Install backend requirements
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
          fi

      # ============================================================
      # SOURCE STRUCTURE
      # ============================================================

      - name: Validate required A227C source components
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "backend/a227c/core/indicators.py"
            "backend/a227c/core/strategies.py"
            "backend/a227c/core/research_candidates.py"
            "backend/a227c/research/run_research.py"
            "backend/a227c/research/candidate_backtest.py"
            "backend/a227c/research/tick_replay.py"
            "backend/a227c/research/statistics.py"
            "backend/a227c/research/duration_calibration.py"
            "backend/a227c/research/swap_ledger.py"
            "backend/a227c/research/shadow.py"
            "backend/a227c/research/acceptance.py"
            "backend/a227c/research/validate_all.py"
            "backend/a227c/providers/symbol_discovery.py"
            "backend/a227c/adapters/mt5_adapter.py"
            "backend/a227c/adapters/deriv_adapter.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required component missing: $FILE"
              exit 1
            fi
          done

          echo "Required A227C components confirmed."

      # ============================================================
      # IMPORTS
      # ============================================================

      - name: Verify backend imports
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          from a227c.core.indicators import *
          from a227c.core.strategies import *
          from a227c.core.research_candidates import *
          from a227c.research.candidate_backtest import *
          from a227c.research.tick_replay import *
          from a227c.research.statistics import *
          from a227c.research.duration_calibration import *
          from a227c.research.swap_ledger import *
          from a227c.research.shadow import *
          from a227c.research.acceptance import *
          from a227c.research.validate_all import *
          from a227c.providers.symbol_discovery import *
          from a227c.adapters.mt5_adapter import *
          from a227c.adapters.deriv_adapter import *

          print("A227C backend imports successful.")
          PY

      # ============================================================
      # COMPILE
      # ============================================================

      - name: Compile Python modules
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q backend/a227c

          echo "Python compilation successful."

      # ============================================================
      # TESTS
      # ============================================================

      - name: Run complete backend test suite
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          if [[ -d backend/tests ]]; then
            python -m pytest backend/tests -v
          elif [[ -d tests ]]; then
            python -m pytest tests -v
          else
            echo "::error::Backend test directory not found."
            exit 1
          fi

      # ============================================================
      # FIVE MARKET COVERAGE
      # ============================================================

      - name: Validate five-market research coverage
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          from a227c.core.research_candidates import (
              RESEARCH_CANDIDATES,
              list_research_candidates,
          )

          required = {
              "XAUUSD",
              "USTECH100",
              "GBPJPY",
              "GBPUSD",
              "USDJPY",
          }

          missing = required - set(RESEARCH_CANDIDATES.keys())

          if missing:
              raise SystemExit(
                  "Missing markets: " + ", ".join(sorted(missing))
              )

          total = 0

          for symbol in sorted(required):
              candidates = list_research_candidates(symbol)

              if not candidates:
                  raise SystemExit(
                      f"No research candidates registered for {symbol}"
                  )

              print(f"{symbol}: {len(candidates)} candidates")
              total += len(candidates)

          print(f"Total registered candidates: {total}")

          if total < 1:
              raise SystemExit("Research candidate registry is empty.")

          PY

      # ============================================================
      # RESEARCH SAFETY
      # ============================================================

      - name: Verify signal-only architecture
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning A227C source for broker execution calls..."

          if grep -RInE \
            --include='*.py' \
            --exclude-dir='__pycache__' \
            '(^|[^A-Za-z0-9_])(mt5\.order_send|order_send\(|order_modify\(|order_delete\()' \
            backend/a227c; then

            echo "::error::Broker trade execution call detected."
            exit 1
          fi

          echo "No broker trade execution calls detected."

      - name: Run research prerequisite audit
        working-directory: ${{ steps.discover.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$PWD/backend${PYTHONPATH:+:$PYTHONPATH}"

          python -m a227c.research.validate_all

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android structure
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.discover.outputs.app_dir }}"
          MANIFEST="${{ steps.discover.outputs.manifest }}"
          LOGO="${{ steps.discover.outputs.logo }}"

          test -f "$MANIFEST"
          test -f "$LOGO"

          if [[ ! -f "$APP/build.gradle" ]] &&
             [[ ! -f "$APP/build.gradle.kts" ]]; then
            echo "::error::Android build file missing."
            exit 1
          fi

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            echo "Gradle wrapper available."
          else
            echo "No Gradle wrapper; using installed Gradle 8.7."
          fi

          command -v gradle >/dev/null

          java -version
          gradle --version

      # ============================================================
      # BOOTSTRAP
      # ============================================================

      - name: Validate production bootstrap configuration
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${A227C_BOOTSTRAP_URL:-}" ]]; then
            echo "::error::A227C_BOOTSTRAP_URL secret is not configured."
            exit 1
          fi

          case "$A227C_BOOTSTRAP_URL" in
            https://*)
              ;;
            *)
              echo "::error::A227C_BOOTSTRAP_URL must use HTTPS."
              exit 1
              ;;
          esac

          case "$A227C_BOOTSTRAP_URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              echo "::error::Localhost bootstrap URL is not allowed."
              exit 1
              ;;
          esac

          echo "Production bootstrap configuration accepted."

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android project
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          gradle --no-daemon \
            -PA227C_BOOTSTRAP_URL="$A227C_BOOTSTRAP_URL" \
            "${{ steps.discover.outputs.module_task }}:clean"

      # ============================================================
      # DEBUG APK
      # ============================================================

      - name: Build Debug APK
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          gradle --no-daemon \
            -PA227C_BOOTSTRAP_URL="$A227C_BOOTSTRAP_URL" \
            "${{ steps.discover.outputs.module_task }}:assembleDebug"

      - name: Verify Debug APK
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.discover.outputs.app_dir }}"

          APK="$(find "$APP/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Debug-APK
          path: |
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ steps.discover.outputs.gradle_root }}
        shell: bash
        env:
          A227C_BOOTSTRAP_URL: ${{ secrets.A227C_BOOTSTRAP_URL }}
        run: |
          set -euo pipefail

          gradle --no-daemon \
            -PA227C_BOOTSTRAP_URL="$A227C_BOOTSTRAP_URL" \
            "${{ steps.discover.outputs.module_task }}:assembleRelease"

      - name: Verify Release APK
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.discover.outputs.app_dir }}"

          APK="$(find "$APP/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk

          sha256sum \
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk \
            > artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk.sha256

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Release-APK
          path: |
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk
            artifacts/UNIVERSAL-TRADING-BOT-A227C-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # VALIDATED SOURCE PACKAGE
      # ============================================================

      - name: Package validated source
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf validated-source

          mkdir -p validated-source

          rsync -a \
            --exclude='.git/' \
            --exclude='validated-source/' \
            --exclude='artifacts/' \
            --exclude='**/__pycache__/' \
            --exclude='**/.pytest_cache/' \
            --exclude='**/.gradle/' \
            --exclude='**/build/' \
            "$GITHUB_WORKSPACE/" \
            validated-source/

          zip -qr \
            UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            validated-source

          sha256sum \
            UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip \
            > UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip.sha256

          test -s UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip

      - name: Upload validated source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-TRADING-BOT-A227C-Validated-Source
          path: |
            UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip
            UNIVERSAL-TRADING-BOT-A227C-VALIDATED-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: Generate build report
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          {
            echo "# UNIVERSAL-TRADING-BOT-A227C BUILD REPORT"
            echo
            echo "## Build Environment"
            echo
            echo "- Runner: Ubuntu 22.04"
            echo "- Python: 3.11"
            echo "- Java: 17"
            echo "- Gradle: 8.7"
            echo "- Android API: 35"
            echo "- Job status: $BUILD_STATUS"
            echo
            echo "## Markets"
            echo
            echo "- XAUUSD"
            echo "- USTECH100"
            echo "- GBPJPY"
            echo "- GBPUSD"
            echo "- USDJPY"
            echo
 
